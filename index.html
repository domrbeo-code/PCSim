  });
  html+='</div>';
  showModal('Danh bạ Đối thủ',html);
}

function showAiBrandProfile(brandId){
  try{
    if(!game.aiBrands||!Array.isArray(game.aiBrands)){showToast('Dữ liệu hãng AI chưa sẵn sàng','err');return;}
    const b=game.aiBrands.find(x=>x&&x.id===brandId);
    if(!b){showToast('Không tìm thấy hãng AI','err');return;}
    const statusText=b.status==='rising'?'Đang phát triển':b.status==='falling'?'Đang suy giảm':b.status==='stuck'?'Bị kẹt':b.status==='leader'?'Đứng đầu':'Ổn định';
    const statusColor=b.status==='rising'?'var(--ok)':b.status==='falling'||b.status==='stuck'?'var(--err)':b.status==='leader'?'var(--ac)':'var(--s)';
    const exclusiveParts=CATALOG.filter(p=>p&&p.aiMade&&p.brand===b.name);
    const catLabelP=CAT_LABELS[b.cat]||b.cat||'Khác';
    let html='<div class="wiki-page"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">';
    html+='<div style="width:48px;height:48px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--p)">'+(b.name||'?').charAt(0)+'</div>';
    html+='<div><h4 style="margin:0">'+b.name+'</h4>';
    html+='<span style="font-size:11px;color:'+statusColor+';font-weight:700">'+statusText+'</span></div></div>';
    html+='<div class="wiki-spec">';
    html+='<div class="ws-row"><span class="ws-label">Lĩnh vực</span><span class="ws-val">'+catLabelP+'</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Thị phần</span><span class="ws-val">'+Math.round(b.share||0)+'%</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Doanh thu</span><span class="ws-val">'+fmtMoney(b.revenue||0)+'</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Mức công nghệ</span><span class="ws-val">'+(b.techLevel||0)+'</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Ngày gia nhập</span><span class="ws-val">Ngày '+(b.foundedDay||1)+'</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Hoạt động</span><span class="ws-val">'+(b.daysActive||0)+' ngày</span></div>';
    html+='<div class="ws-row"><span class="ws-label">Linh kiện độc quyền</span><span class="ws-val" style="color:var(--ac);font-weight:700">'+exclusiveParts.length+' sản phẩm</span></div>';
    html+='</div>';
    if(exclusiveParts.length){
      html+='<h4 style="margin:14px 0 8px;color:var(--p)">Linh kiện độc quyền của '+b.name+'</h4>';
      html+='<div class="item-list" style="max-height:250px">';
      exclusiveParts.sort((a,b2)=>(b2.perf||0)-(a.perf||0)).forEach(p=>{
        const price=Math.round((p.cost||0)*getActivePriceModifier());
        const inStock=game.stock.some(s=>s.id===p.id);
        const pCatLabel=CAT_LABELS[p.cat]||p.cat||'Khác';
        html+='<div class="item"><div class="info"><div class="name">'+p.n+(inStock?' <span class="cond-badge cond-good" style="font-size:9px">Có trong kho</span>':'')+'</div>';
        html+='<div class="meta">'+pCatLabel+' · Perf '+(p.perf||0)+' · '+(p.watt||0)+'W'+(p.vram?' · '+p.vram+'GB VRAM':'')+' · '+fmtMoney(p.cost||0)+'</div></div>';
        if(!b.bankrupt){
          html+='<button class="btn btn-sm btn-p" onclick="buyAiBrandItem(\''+p.id+'\','+price+')" '+(game.money>=price?'':'disabled')+'>Mua</button>';
        } else {
          html+='<span style="font-size:11px;color:var(--err)">Ngừng bán</span>';
        }
        html+='</div>';
      });
      html+='</div>';
    } else {
      html+='<div class="empty-state" style="margin-top:12px">'+b.name+' chưa tung ra linh kiện nào. Theo dõi trong các ngày tới!</div>';
    }
    if(b.bankrupt){
      html+='<div style="margin-top:12px;padding:10px;background:rgba(239,68,68,.1);border-radius:8px;font-size:13px;color:var(--err);text-align:center">Hãng này đã PHÁ SẢN. Linh kiện ngừng bán trên thị trường. Những linh kiện đã mua vẫn nằm trong kho như hàng hiếm sưu tầm.</div>';
    }
    html+='</div>';
    showModal('Hồ sơ Hãng AI: '+b.name,html);
  }catch(e){
    showModal('Lỗi','<div style="padding:20px;color:var(--err)">Không thể hiển thị thông tin hãng này: '+(e&&e.message?e.message:'')+'</div>');
  }
}

function buyAiBrandItem(id,price){
  const it=getItemById(id);
  if(!it){showToast('Linh kiện không tồn tại','err');return;}
  if(game.money<price){showToast('Không đủ tiền','err');return;}
  game.money-=price;
  const shipId=Date.now()+Math.random();
  game.pendingShipments.push({uid:shipId,id,cost:price,used:false,condition:'good',conditionLabel:'Mới',perfPenalty:0,daysLeft:2,totalDays:2});
  pushLog('Mua linh kiện AI '+it.n+': '+fmtMoney(price)+' - giao 2 ngày','info');
  showToast('Đã đặt mua '+it.n+' - giao 2 ngày','ok');
  closeModal();renderStats();
  saveGame(true);
}

function openCraftDialog(cat){
  const baseItems=getByCat(cat,game.eraIdx);
  if(!baseItems.length){showToast('Chưa có linh kiện gốc để chế tạo','err');return;}
  const prefix=CRAFT_PREFIXES[cat][Math.floor(Math.random()*CRAFT_PREFIXES[cat].length)];
  const defaultName=prefix+'-'+Math.floor(Math.random()*900+100);
  const maxPerf=cat==='gpu'?300:cat==='cpu'?250:cat==='ram'?150:100;
  let html='<div style="padding:10px">';
  html+='<div class="custom-stat"><label style="min-width:120px;font-size:12px;color:var(--txt3)">Tên sản phẩm:</label><input type="text" id="craft-name" value="'+defaultName+'" style="width:220px"></div>';
  html+='<div class="custom-stat"><label style="min-width:120px;font-size:12px;color:var(--txt3)">Linh kiện gốc:</label><select id="craft-base" style="width:220px">';
  baseItems.slice(-10).forEach(b=>html+='<option value="'+b.id+'">'+b.n+' (Perf '+b.perf+')</option>');
  html+='</select></div>';
  html+='<div class="custom-stat"><label style="min-width:120px;font-size:12px;color:var(--txt3)">Hiệu suất (1-'+maxPerf+'):</label><input type="number" id="craft-perf" value="80" min="1" max="'+maxPerf+'" style="width:120px" oninput="updateCraftCostDisplay(\""+cat+"\")"></div>';
  html+='<div class="custom-stat"><label style="min-width:120px;font-size:12px;color:var(--txt3)">Watt (10-500):</label><input type="number" id="craft-watt" value="100" min="10" max="500" style="width:120px" oninput="updateCraftCostDisplay(\""+cat+"\")"></div>';
  if(cat==='gpu'){
    html+='<div class="custom-stat"><label style="min-width:120px;font-size:12px;color:var(--txt3)">VRAM (1-128 GB):</label><input type="number" id="craft-vram" value="8" min="1" max="128" style="width:120px" oninput="updateCraftCostDisplay(\"gpu\")"></div>';
  }
  html+='<div id="craft-cost-display" style="margin-top:10px;font-size:13px;font-weight:700;color:var(--ac)"></div>';
  html+='<div style="margin-top:12px"><button class="btn btn-p" onclick="confirmCraft(\''+cat+'\')">Bắt đầu R&D</button></div></div>';
  showModal('Chế tạo '+CAT_LABELS[cat]+' độc quyền',html);
  updateCraftCostDisplay(cat);
}

function updateCraftCostDisplay(cat){
  const pEl=document.getElementById('craft-perf');
  const wEl=document.getElementById('craft-watt');
  const vEl=document.getElementById('craft-vram');
  if(!pEl) return;
  const p=parseInt(pEl.value)||1;
  const w=parseInt(wEl.value)||10;
  const v=cat==='gpu'?(parseInt(vEl&&vEl.value)||8):0;
  const cost=RND_BASE_COST+p*50+w*5+(cat==='gpu'?v*100:0);
  const days=Math.max(3,Math.ceil(p/20));
  const el=document.getElementById('craft-cost-display');
  if(el) el.textContent='Chi phí R&D: '+fmtMoney(cost)+' · Thời gian: '+days+' ngày';
}

function confirmCraft(cat){
  const name=document.getElementById('craft-name').value;
  const baseId=document.getElementById('craft-base').value;
  const perf=parseInt(document.getElementById('craft-perf').value)||1;
  const watt=parseInt(document.getElementById('craft-watt').value)||10;
  const vram=cat==='gpu'?(parseInt(document.getElementById('craft-vram').value)||8):0;
  const cost=RND_BASE_COST+perf*50+watt*5+(cat==='gpu'?vram*100:0);
  startRndProject(cat,baseId,name,perf,watt,cost,vram);
  closeModal();
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function initNews(){
  game.newsFeed=[];
  for(let i=0;i<3;i++) generateNewsItem();
  game.newsUnread=0;
}

function generateNewsItem(){
  const era=game.eraIdx;
  const tmpl=pick(NEWS_TEMPLATES);
  const vars=tmpl.gen(era);
  let title=tmpl.title,body=tmpl.body;
  for(const [k,v] of Object.entries(vars)){
    title=title.replace('{'+k+'}',v);
    body=body.replace('{'+k+'}',v);
  }
  const newsItem={
    id:Date.now()+Math.random(),
    tag:tmpl.tag,
    title,body,
    impact:tmpl.impact,
    day:game.day,
    unread:true,
  };
  game.newsFeed.unshift(newsItem);
  if(game.newsFeed.length>40) game.newsFeed.pop();
  game.newsUnread++;
  pushLog('[Tin tức] '+title,'info');
  return newsItem;
}

function updateNews(){
  if(game.day%4===0){
    generateNewsItem();
    if(game.day%8===0&&Math.random()<0.5) generateNewsItem();
  }
}

function getNewsPriceModifier(){
  let mod=1.0;
  game.newsFeed.slice(0,5).forEach(n=>{
    if(n.tag==='crisis'&&n.unread) mod*=1.15;
    if(n.tag==='policy'&&n.unread&&n.title.includes('thuế')) mod*=1.08;
    if(n.tag==='opportunity'&&n.unread) mod*=0.95;
  });
  return Math.min(1.5,Math.max(0.8,mod));
}

function renderNews(){
  const el=document.getElementById('tab-news');
  const filtered=game.newsFilter==='all'?game.newsFeed:game.newsFeed.filter(n=>n.tag===game.newsFilter);
  let html='<div class="card"><h3>Báo chí & Tin tức Thị trường</h3>';
  html+='<div class="sub">Theo dõi tin tức để nắm bắt thời cơ kinh doanh. Tin tức cập nhật mỗi vài ngày.</div>';
  html+='<div class="news-stats"><div class="news-stat"><span class="v">'+game.newsFeed.length+'</span><span class="l">Tổng tin</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--p)">'+game.newsUnread+'</span><span class="l">Chưa đọc</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--ac)">'+ERAS[game.eraIdx].name+'</span><span class="l">Kỷ nguyên</span></div></div>';
  html+='<div class="news-filter"><button class="'+(game.newsFilter==='all'?'active':'')+'" onclick="setNewsFilter(\'all\')">Tất cả</button>';
  const tags=[['market','Thị trường'],['product','Sản phẩm'],['policy','Chính sách'],['crisis','Khủng hoảng'],['opportunity','Cơ hội']];
  tags.forEach(t=>{html+='<button class="'+(game.newsFilter===t[0]?'active':'')+'" onclick="setNewsFilter(\''+t[0]+'\')">'+t[1]+'</button>';});
  html+='</div><div class="news-feed">';
  if(!filtered.length){
    html+='<div class="empty-state">Chưa có tin tức nào trong mục này.</div>';
  } else {
    filtered.forEach(n=>{
      html+='<div class="news-item '+(n.unread?'unread':'')+'" onclick="markNewsRead(\''+n.id+'\')">';
      html+='<div class="news-head"><div class="news-title"><span class="news-tag '+n.tag+'">'+getNewsTagLabel(n.tag)+'</span>'+n.title+'</div>';
      html+='<div class="news-date">Ngày '+n.day+'</div></div>';
      html+='<div class="news-body">'+n.body+'</div>';
      html+='<div class="news-impact">⚡ '+n.impact+'</div></div>';
    });
  }
  html+='</div></div>';
  el.innerHTML=html;
}

function getNewsTagLabel(tag){
  const m={market:'Thị trường',product:'Sản phẩm',policy:'Chính sách',crisis:'Khủng hoảng',opportunity:'Cơ hội'};
  return m[tag]||tag;
}

function setNewsFilter(f){game.newsFilter=f;renderNews();}
function markNewsRead(id){
  const n=game.newsFeed.find(x=>String(x.id)===String(id));
  if(n&&n.unread){n.unread=false;game.newsUnread=Math.max(0,game.newsUnread-1);}
  renderNews();
}

function maybeTriggerEvent(){
  if(game.activeEvents.length>=2) return;
  const baseChance=0.08;
  const eraBonus=game.eraIdx*0.01;
  if(Math.random()<baseChance+eraBonus){
    const pool=EVENT_POOL.filter(e=>!game.activeEvents.some(ae=>ae.id===e.id));
    if(!pool.length) return;
    const evt=pick(pool);
    triggerEvent(evt);
  }
}

function triggerEvent(evtDef){
  const evt={...evtDef,id:evtDef.id,daysLeft:evtDef.duration,startDay:game.day,effects:evtDef.effects||[]};
  if(evt.duration===0){
    applyEventEffects(evt);
    game.eventHistory.unshift({title:evt.title,desc:evt.desc,type:evt.type,day:game.day});
    if(game.eventHistory.length>20) game.eventHistory.pop();
  } else {
    game.activeEvents.push(evt);
    pushLog('[Sự kiện] '+evt.title+': '+evt.desc,evt.type==='good'?'ok':'err');
    showToast('Sự kiện: '+evt.title,evt.type==='good'?'ok':'err');
    applyEventEffects(evt);
  }
}

function applyEventEffects(evt){
  evt.effects.forEach(eff=>{
    switch(eff.kind){
      case 'stockLoss':
        const lossCount=Math.floor(game.stock.length*0.2);
        for(let i=0;i<lossCount&&game.stock.length;i++) game.stock.splice(Math.floor(Math.random()*game.stock.length),1);
        pushLog('Mất '+lossCount+' món trong kho do cháy!','err');
        break;
      case 'cafeIncomeReduce':
        evt.cafeReduce=eff.val;
        break;
      case 'priceModifier':
        evt.priceMod=eff.val;
        break;
      case 'extraOrders':
        for(let i=0;i<(eff.val||2);i++) generateOrders(1);
        break;
      case 'repBoost':
        game.reputation+=eff.val||5;
        pushLog('Danh tiếng +'+(eff.val||5),'ok');
        break;
      case 'shareBoost':
        game.marketShare=Math.min(60,game.marketShare+(eff.val||3));
        pushLog('Thị phần +'+(eff.val||3)+'%','ok');
        break;
      case 'moneyLoss':
        game.money-=eff.val||1000;
        pushLog('Mất '+fmtMoney(eff.val||1000),'err');
        break;
      case 'stationBreak':
        const idx=game.stations.findIndex(s=>s.pc);
        if(idx>=0){game.stations[idx].pc=null;pushLog('Máy '+(idx+1)+' hỏng do sụt áp!','err');}
        break;
    }
  });
}

function updateEvents(){
  for(let i=game.activeEvents.length-1;i>=0;i--){
    const evt=game.activeEvents[i];
    evt.daysLeft--;
    if(evt.daysLeft<=0){
      game.eventHistory.unshift({title:evt.title,desc:evt.desc+': Đã kết thúc.',type:evt.type,day:game.day});
      if(game.eventHistory.length>20) game.eventHistory.pop();
      pushLog('Sự kiện "'+evt.title+'" đã kết thúc.','info');
      game.activeEvents.splice(i,1);
    }
  }
  maybeTriggerEvent();
}

function getEventPriceModifier(){
  let mod=1.0;
  game.activeEvents.forEach(e=>{if(e.priceMod) mod*=e.priceMod;});
  return mod;
}

function getEventCafeModifier(){
  let mod=1.0;
  game.activeEvents.forEach(e=>{if(e.cafeReduce) mod*=(1-e.cafeReduce);});
  return mod;
}

// ============ B2B CONTRACTS & TENDERING ============
const CONTRACT_CLIENTS=[
  {n:'Đại học Quốc Gia',type:'Trường đại học'},
  {n:'Tập đoàn VinaTech',type:'Tập đoàn IT'},
  {n:'Bệnh viện MedCare',type:'Bệnh viện'},
  {n:'Trung tâm DataPro',type:'Trung tâm dữ liệu'},
  {n:'Quỹ đầu tư AlphaCap',type:'Quỹ đầu tư'},
  {n:'Công ty GameStar',type:'Studio game'},
  {n:'Khách sạn Royal Plaza',type:'Khách sạn'},
  {n:'Sở Giáo Dục TP',type:'Cơ quan nhà nước'},
  {n:'Hãng phim DigitalEye',type:'Studio đồ họa'},
  {n:'Startup AI Nexus',type:'Startup AI'},
  {n:'Chuỗi Internet EZ Net',type:'Chuỗi Internet'},
  {n:'Trường STEM Future',type:'Trường STEM'},
];

function generateContract(){
  const era=game.eraIdx;
  const client=pick(CONTRACT_CLIENTS);
  const deviceType=pick(['PC','PC','PC','Laptop','Laptop','Tablet']);
  const quantity=Math.floor(Math.random()*15+5)+era*3;
  const targetTier=2+Math.floor(Math.random()*Math.min(3,1+era));
  const minPerf=Math.floor(15+era*12+Math.random()*15);
  const reward=Math.round(quantity*(minPerf*25+200)*(1+era*0.3));
  const penalty=Math.round(reward*0.35);
  const deadline=Math.floor(8+Math.random()*8+era);
  const repGain=Math.floor(5+quantity/3+minPerf/10);
  const req={};
  const cats=['cpu','gpu','mb','ram','psu','case','storage'];
  cats.forEach(cat=>{
    const items=getByCat(cat,era).filter(p=>p.tier<=targetTier+1);
    if(items.length){req[cat]=pick(items).id;}
  });
  return {
    id:Date.now()+Math.random(),
    client:client.n,clientType:client.type,
    deviceType,quantity,minPerf,
    reward,penalty,deadline,repGain,
    req,dayOffered:game.day,
    status:'available',
    progress:0,delivered:0,
  };
}

function generateInitialContracts(){
  game.contracts=[];
  for(let i=0;i<3;i++) game.contracts.push(generateContract());
}

function updateContracts(){
  for(let i=game.contracts.length-1;i>=0;i--){
    const ct=game.contracts[i];
    if(ct.status==='active'){
      ct.deadline--;
      if(ct.deadline<=0){
        if(ct.delivered>=ct.quantity){
          ct.status='completed';
          const bonus=Math.round(ct.reward*(ct.delivered/ct.quantity));
          game.money+=bonus;
          game.reputation+=ct.repGain;
          game.contractRepBonus+=ct.repGain;
          pushLog('[Hợp đồng] Hoàn thành đơn '+ct.client+'! +'+fmtMoney(bonus)+', +'+ct.repGain+' uy tín','ok');
          showToast('Hoàn thành hợp đồng '+ct.client+'!','ok');
        } else {
          ct.status='failed';
          game.money-=ct.penalty;
          game.reputation=Math.max(0,game.reputation-10);
          pushLog('[Hợp đồng] Trễ hạn '+ct.client+'! Phạt '+fmtMoney(ct.penalty)+', -10 uy tín','err');
          showToast('Trễ hợp đồng! Phạt '+fmtMoney(ct.penalty),'err');
        }
        game.contractHistory.unshift({client:ct.client,status:ct.status,reward:ct.reward,penalty:ct.penalty,day:game.day});
        if(game.contractHistory.length>15) game.contractHistory.pop();
      }
    }
  }
  if(game.day%5===0&&game.contracts.filter(c=>c.status==='available').length<3){
    game.contracts.push(generateContract());
  }
  if(game.contracts.length>20){
    game.contracts=game.contracts.filter(c=>c.status==='available'||c.status==='active');
  }
}

function getActivePriceModifier(){
  return getNewsPriceModifier()*getEventPriceModifier();
}

function acceptContract(idx){
  const ct=game.contracts[idx];
  if(!ct||ct.status!=='available') return;
  if(game.reputation<5){showToast('Cần ít nhất 5 danh tiếng để nhận hợp đồng','err');return;}
  ct.status='active';
  ct.dayAccepted=game.day;
  pushLog('[Hợp đồng] Nhận đơn '+ct.client+' ('+ct.quantity+' '+ct.deviceType+', hạn '+ct.deadline+' ngày)','info');
  showToast('Đã nhận hợp đồng '+ct.client,'ok');
  renderContracts();
}

function deliverToContract(idx){
  const ct=game.contracts[idx];
  if(!ct||ct.status!=='active') return;
  const availPCs=game.pcs.filter(p=>!game.stations.some(s=>s.pc===p.id)&&!p.assignedContract);
  const availDevices=game.deviceStock.filter(d=>!d.assignedContract);
  let pool=[];
  if(ct.deviceType==='PC') pool=availPCs;
  else if(ct.deviceType==='Laptop') pool=availDevices.filter(d=>d.type==='laptop');
  else if(ct.deviceType==='Tablet') pool=availDevices.filter(d=>d.type==='tablet');
  if(!pool.length){showToast('Không có thiết bị phù hợp để giao','warn');return;}
  let html='<div class="item-list" style="max-height:300px">';
  pool.slice(0,15).forEach(p=>{
    const perf=ct.deviceType==='PC'?p.perf:p.perf;
    const meets=perf>=ct.minPerf;
    html+='<div class="item"><div class="info"><div class="name">'+(ct.deviceType==='PC'?'PC #':'Thiết bị ')+Math.round(p.id)+'</div>';
    html+='<div class="meta">Perf: '+perf+' '+(meets?'<span class="badge badge-ok">Đạt</span>':'<span class="badge badge-err">Không đạt</span>')+'</div></div>';
    html+='<button class="btn btn-sm btn-ok" onclick="confirmDeliverContract('+idx+','+p.id+',\''+ct.deviceType+'\')">Giao</button></div>';
  });
  html+='</div>';
  showModal('Giao thiết bị cho '+ct.client,html);
}

function confirmDeliverContract(idx,itemId,deviceType){
  const ct=game.contracts[idx];
  if(!ct||ct.status!=='active') return;
  let item,perf;
  if(deviceType==='PC'){
    item=game.pcs.find(p=>p.id===itemId);
    if(!item){closeModal();return;}
    perf=item.perf;
    item.assignedContract=ct.id;
  } else {
    item=game.deviceStock.find(d=>d.id===itemId);
    if(!item){closeModal();return;}
    perf=item.perf;
    item.assignedContract=ct.id;
    const di=game.deviceStock.indexOf(item);
    if(di>=0) game.deviceStock.splice(di,1);
  }
  ct.delivered++;
  ct.progress=Math.min(100,Math.round(ct.delivered/ct.quantity*100));
  const meets=perf>=ct.minPerf;
  if(!meets){
    game.reputation=Math.max(0,game.reputation-2);
    pushLog('[Hợp đồng] Giao hàng không đạt yêu cầu chất lượng! -2 uy tín','warn');
    showToast('Thiết bị không đạt chất lượng!','warn');
  }
  const partialPay=Math.round(ct.reward/ct.quantity);
  game.money+=partialPay;
  pushLog('[Hợp đồng] Giao '+deviceType+' cho '+ct.client+': +'+fmtMoney(partialPay)+' ('+ct.delivered+'/'+ct.quantity+')','ok');
  if(ct.delivered>=ct.quantity){
    ct.status='completed';
    const bonus=Math.round(ct.reward*0.2);
    game.money+=bonus;
    game.reputation+=ct.repGain;
    game.contractRepBonus+=ct.repGain;
    pushLog('[Hợp đồng] Hoàn thành toàn bộ! Thưởng +'+fmtMoney(bonus)+', +'+ct.repGain+' uy tín','ok');
    showToast('Hoàn thành hợp đồng! Thưởng '+fmtMoney(bonus),'ok');
    game.contractHistory.unshift({client:ct.client,status:'completed',reward:ct.reward+bonus,penalty:0,day:game.day});
    if(game.contractHistory.length>15) game.contractHistory.pop();
  }
  closeModal();
  renderContracts();renderStats();
}

function renderContracts(){
  const el=document.getElementById('tab-contracts');
  let html='<div class="card"><h3>Hợp đồng B2B & Đấu thầu dự án lớn</h3>';
  html+='<div class="sub">Nhận đơn hàng quy mô lớn từ tổ chức, doanh nghiệp, trường học. Giao đúng hạn nhận thưởng lớn + uy tín. Trễ hạn = phạt nặng.</div>';
  html+='<div class="news-stats"><div class="news-stat"><span class="v" style="color:var(--s)">'+game.contracts.filter(c=>c.status==='available').length+'</span><span class="l">Đang chờ</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--ac)">'+game.contracts.filter(c=>c.status==='active').length+'</span><span class="l">Đang làm</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--ok)">'+game.contractRepBonus+'</span><span class="l">Uy tín tích lũy</span></div></div>';
  const active=game.contracts.filter(c=>c.status==='active');
  const available=game.contracts.filter(c=>c.status==='available');
  if(active.length){
    html+='<h4 style="margin:10px 0 6px;color:var(--ac)">Hợp đồng đang thực hiện</h4>';
    active.forEach(ct=>{
      const ci=game.contracts.indexOf(ct);
      const urgent=ct.deadline<=3;
      html+=renderContractCard(ct,ci,urgent);
    });
  }
  if(available.length){
    html+='<h4 style="margin:14px 0 6px;color:var(--s)">Hợp đồng sẵn sàng nhận</h4>';
    available.forEach(ct=>{
      const ci=game.contracts.indexOf(ct);
      html+=renderContractCard(ct,ci,false);
    });
  }
  const done=game.contracts.filter(c=>c.status==='completed'||c.status==='failed');
  if(done.length){
    html+='<h4 style="margin:14px 0 6px">Hợp đồng đã kết thúc</h4>';
    done.forEach(ct=>{
      const ci=game.contracts.indexOf(ct);
      html+=renderContractCard(ct,ci,false);
    });
  }
  if(game.contractHistory.length){
    html+='<h4 style="margin:14px 0 6px">Lịch sử hợp đồng</h4><div class="event-history">';
    game.contractHistory.forEach(h=>{
      const cls=h.status==='completed'?'ok':'err';
      const txt=h.status==='completed'?'Hoàn thành +'+fmtMoney(h.reward):'Trễ hạn -'+fmtMoney(h.penalty);
      html+='<div class="event-hist-item '+cls+'"><b>Ngày '+h.day+'</b>: '+h.client+' - '+txt+'</div>';
    });
    html+='</div>';
  }
  if(!game.contracts.length) html+='<div class="empty-state">Chưa có hợp đồng nào. Hãy kiên nhẫn!</div>';
  html+='</div>';
  el.innerHTML=html;
}

function renderContractCard(ct,ci,urgent){

  html+='<div class="contract-head"><div><div class="contract-client">'+ct.client+'</div>';
  html+='<div class="contract-type">'+ct.clientType+' · '+ct.deviceType+'</div></div>';

  html+='<div class="contract-grid">';
  html+='<div class="contract-spec"><span class="cs-l">Số lượng</span><span class="cs-v">'+ct.quantity+' thiết bị</span></div>';
  html+='<div class="contract-spec"><span class="cs-l">Perf tối thiểu</span><span class="cs-v">'+ct.minPerf+'</span></div>';
  html+='<div class="contract-spec"><span class="cs-l">Thưởng uy tín</span><span class="cs-v">+'+ct.repGain+'</span></div>';

    html+='<div class="contract-progress-bar"><div class="fill" style="width:'+ct.progress+'%"></div></div></div>';
    html+='<div class="contract-deadline"><span class="contract-deadline-text">'+ct.deadline+' ngày còn lại</span>';
    html+='<div class="contract-deadline-bar"><div class="fill" style="width:'+Math.min(100,ct.deadline/15*100)+'%;background:'+(urgent?'var(--err)':'var(--ok)')+'"></div></div></div>';
    html+='<div class="row"><span class="contract-status-badge active">Đang thực hiện</span>';

    html+='<span style="font-size:11px;color:var(--err)">-'+fmtMoney(ct.penalty)+'</span></div>';
  }
  html+='</div>';
  return html;
}


// ============ SAVE / LOAD SYSTEM ============
const SAVE_KEY='tycoon_save_game';
const SAVE_VERSION=2;
const AUTO_SAVE_INTERVAL=60000;
let autoSaveTimer=null;
let lastAutoSave=0;

function buildGameState(){
  return{
    version:SAVE_VERSION,
    timestamp:Date.now(),
    day:game.day,
    money:game.money,
    eraIdx:game.eraIdx,
    stock:game.stock,
    pcs:game.pcs,
    orders:game.orders,
    repairs:game.repairs,
    sales:game.sales,
    build:game.build,
    gameOver:game.gameOver,
    stations:game.stations,
    log:game.log,
    pendingDeliveries:game.pendingDeliveries,
    pendingShipments:game.pendingShipments,
    benchSelectedGame:game.benchSelectedGame,
    benchGfxSetting:game.benchGfxSetting,
    benchSelectedDevice:game.benchSelectedDevice,
    reputation:game.reputation,
    marketShare:game.marketShare,
    totalRevenue:game.totalRevenue,
    competitors:game.competitors,
    partners:game.partners,
    craftedItems:game.craftedItems,
    rndProjects:game.rndProjects,
    aiThreats:game.aiThreats,
    endgameActive:game.endgameActive,
    techLevel:game.techLevel,
    overclock:game.overclock,
    buildCooling:game.buildCooling,
    deviceBuild:game.deviceBuild,
    deviceStock:game.deviceStock,
    employees:game.employees,
    stocks:game.stocks,
    aiBrands:game.aiBrands,
    cafePricePerHour:game.cafePricePerHour,
    cafeExpandCount:game.cafeExpandCount,
    cafeMonthlyBill:game.cafeMonthlyBill,
    cafeDaysInMonth:game.cafeDaysInMonth,
    newsFeed:game.newsFeed,
    newsUnread:game.newsUnread,
    activeEvents:game.activeEvents,
    eventHistory:game.eventHistory,
    contracts:game.contracts,
    contractHistory:game.contractHistory,
    contractRepBonus:game.contractRepBonus,
    newsFilter:game.newsFilter,
    aiCatalogItems:CATALOG.filter(p=>p.aiMade&&!p.threat),
    uiState:S,
  };
}

function restoreGameState(state){
  const keys=['version','timestamp','uiState'];
  Object.keys(state).forEach(k=>{
    if(keys.includes(k))return;
    if(k==='stocks'||k==='aiBrands'||k==='competitors'||k==='partners'||k==='newsFeed'){
      game[k]=state[k];
    }else{
      game[k]=state[k];
    }
  });
  if(state.uiState){
    Object.keys(state.uiState).forEach(k=>{S[k]=state.uiState[k];});
  }
  game.overclock=state.overclock||{...OC_DEFAULTS};
  if(!game.overclock.wear)game.overclock.wear={cpu:0,gpu:0,ram:0};
  if(!game.stations)game.stations=Array.from({length:6},(_,i)=>({id:i+1,pc:null}));
  if(!game.newsFeed)game.newsFeed=[];
  if(!game.activeEvents)game.activeEvents=[];
  if(!game.eventHistory)game.eventHistory=[];
  if(!game.pendingShipments)game.pendingShipments=[];
  if(!game.contracts)game.contracts=[];
  if(!game.contractHistory)game.contractHistory=[];
  if(!game.craftedItems)game.craftedItems=[];
  if(!game.rndProjects)game.rndProjects=[];
  if(!game.aiThreats)game.aiThreats=[];
  if(!game.deviceStock)game.deviceStock=[];
  if(!game.employees)game.employees=[];
  if(!game.partners)game.partners=initPartners();
  if(!game.aiBrands)game.aiBrands=initAiBrands();
  game.aiBrands.forEach(b=>{if(b.bankrupt===undefined)b.bankrupt=false;if(b.share===undefined)b.share=5;if(b.revenue===undefined)b.revenue=2000;if(b.status===undefined)b.status='stable';if(b.foundedDay===undefined)b.foundedDay=1;if(b.daysActive===undefined)b.daysActive=0;});
  if(!game.stocks)game.stocks=initStocks();
  if(!game.log)game.log=[];
  game.newsFilter=game.newsFilter||'all';
  game.benchGfxSetting=game.benchGfxSetting||'medium';
  game.benchSelectedGame=game.benchSelectedGame||'cs2';
  game.benchSelectedDevice=game.benchSelectedDevice||'pc';
  game.buildCooling=game.buildCooling||'stock';
  game.deviceBuild=game.deviceBuild||{type:null,cpu:null,gpu:null,ram:null,storage:null,mb:null};
  if(!game.overclock.ramV)game.overclock.ramV=1.0;
}

function saveGame(silent){
  try{
    const state=buildGameState();
    const json=JSON.stringify(state);
    localStorage.setItem(SAVE_KEY,json);
    lastAutoSave=Date.now();
    if(!silent){
      showToast('Đã lưu game!','ok');
      pushLog('Lưu game thủ công thành công','info');
    }
    updateSaveInfo();
    return true;
  }catch(e){
    showToast('Lỗi lưu game: '+e.message,'err');
    return false;
  }
}

function autoSave(){
  if(game&&game.day>0){
    saveGame(true);
  }
}

function hasSaveData(){
  try{
    return localStorage.getItem(SAVE_KEY)!==null;
  }catch(e){
    return false;
  }
}

function getSaveInfo(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const s=JSON.parse(raw);
    return{
      day:s.day||1,
      money:s.money||0,
      era:ERAS[s.eraIdx||0].name,
      timestamp:s.timestamp||0,
      age:Date.now()-(s.timestamp||0),
    };
  }catch(e){
    return null;
  }
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw){
      showToast('Không có dữ liệu save!','warn');
      return false;
    }
    const state=JSON.parse(raw);
    if(!state||typeof state!=='object'){
      showToast('Dữ liệu save bị hỏng!','err');
      return false;
    }
    cleanCatalogBeforeLoad();
    restoreGameState(state);
    restoreDynamicCatalog(state);
    pushLog('Đã tải game (Ngày '+game.day+', '+ERAS[game.eraIdx].name+')','ok');
    showToast('Tải game thành công! Ngày '+game.day,'ok');
    return true;
  }catch(e){
    showToast('Lỗi tải game: '+e.message,'err');
    return false;
  }
}

function cleanCatalogBeforeLoad(){
  for(let i=CATALOG.length-1;i>=0;i--){if(CATALOG[i].crafted||CATALOG[i].aiMade)CATALOG.splice(i,1);}
}

function restoreDynamicCatalog(state){
  if(state.craftedItems){
    state.craftedItems.forEach(ci=>{
      const existing=CATALOG.find(p=>p.id===ci.id);
      if(!existing)CATALOG.push(ci);
    });
  }
  if(state.aiCatalogItems){
    state.aiCatalogItems.forEach(ci=>{
      const existing=CATALOG.find(p=>p.id===ci.id);
      if(!existing)CATALOG.push(ci);
    });
  }
  if(state.aiThreats){
    state.aiThreats.forEach(t=>{
      const catId='ai_threat_'+t.id;
      const existing=CATALOG.find(p=>p.id===catId);
      if(!existing)CATALOG.push({id:catId,n:t.name,cat:t.cat,e:7,cost:t.cost,watt:t.watt,perf:t.perf,tier:5,aiMade:true,vram:t.vram});
    });
  }
}

function deleteSave(){
  try{
    localStorage.removeItem(SAVE_KEY);
    showToast('Đã xóa dữ liệu save!','warn');
    pushLog('Xóa dữ liệu save game','warn');
    updateSaveInfo();
  }catch(e){
    showToast('Lỗi xóa save: '+e.message,'err');
  }
}

function exportSave(){
  try{
    const state=buildGameState();
    const json=JSON.stringify(state,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='tech_empire_save_day'+game.day+'_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Đã xuất file save!','ok');
    pushLog('Xuất file save .json thành công','info');
  }catch(e){
    showToast('Lỗi xuất file: '+e.message,'err');
  }
}

function importSave(fileInput){
  const file=fileInput.files[0];
  if(!file){showToast('Chưa chọn file','warn');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const state=JSON.parse(e.target.result);
      if(!state||!state.day||typeof state.money==='undefined'){
        showToast('File save không hợp lệ!','err');
        return;
      }
      localStorage.setItem(SAVE_KEY,JSON.stringify(state));
      cleanCatalogBeforeLoad();
      restoreGameState(state);
      restoreDynamicCatalog(state);
      closeModal();
      pushLog('Nhập file save thành công (Ngày '+game.day+')','ok');
      showToast('Nhập save thành công! Đang tải...','ok');
      const activeTab=document.querySelector('#tab-nav button.active');
      if(activeTab)switchTab(activeTab.dataset.tab);
      renderStats();renderLog();
      updateSaveInfo();
    }catch(err){
      showToast('File save bị hỏng: '+err.message,'err');
    }
  };
  reader.readAsText(file);
}

function showSaveLoadModal(){
  const info=getSaveInfo();
  let html='<div>';
  if(info){
    const ageStr=info.age<60000?'vừa xong':info.age<3600000?Math.floor(info.age/60000)+' phút trước':Math.floor(info.age/3600000)+' giờ trước';
    html+='<div class="save-success"><b>Dữ liệu save hiện tại:</b><br>Ngày '+info.day+' · '+info.era+' · Vốn: '+fmtMoney(info.money)+'<br>Lưu lúc: '+ageStr+'</div>';
  }else{
    html+='<div class="save-warning">Chưa có dữ liệu save nào trong trình duyệt.</div>';
  }
  html+='<div class="save-modal-row">';
  html+='<button class="btn btn-p" onclick="saveGame()">💾 Lưu game</button>';
  html+='<button class="btn btn-ok" onclick="loadGame();closeModal();refreshAll()">📂 Tải lại</button>';
  html+='</div>';
  html+='<div class="save-modal-row">';
  html+='<button class="btn btn-ghost" onclick="exportSave()">📤 Xuất file .json</button>';
  html+='<label class="btn btn-ghost" style="text-align:center;cursor:pointer">📥 Nhập file .json<input type="file" accept=".json" style="display:none" onchange="importSave(this)"></label>';
  html+='</div>';
  html+='<div class="save-modal-row">';
  html+='<button class="btn btn-err" onclick="confirmDeleteSave()">🗑️ Xóa save</button>';
  html+='</div>';
  html+='<div style="font-size:11px;color:var(--txt3);margin-top:10px;line-height:1.6">Auto-save chạy mỗi 60 giây và sau mỗi lần chuyển ngày. Xuất file .json để backup dự phòng xóa cache.</div>';
  html+='</div>';
  showModal('Quản lý Lưu trữ Game',html);
}

function confirmDeleteSave(){
  const html='<div class="save-warning">Bạn chắc chắn muốn xóa toàn bộ dữ liệu save? Hành động này không thể hoàn tác!<br><br><button class="btn btn-err" onclick="deleteSave();closeModal()">Xác nhận xóa</button> <button class="btn btn-ghost" onclick="closeModal()">Hủy</button></div>';
  document.querySelector('.modal').innerHTML='<h2>Xác nhận</h2>'+html+'<div style="margin-top:16px;text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button></div>';
}

function startAutoSave(){
  if(autoSaveTimer)clearInterval(autoSaveTimer);
  autoSaveTimer=setInterval(autoSave,AUTO_SAVE_INTERVAL);
}

function updateSaveInfo(){
  const el=document.getElementById('save-info-text');
  if(!el)return;
  const info=getSaveInfo();
  if(info){
    const ageStr=info.age<60000?'vừa xong':info.age<3600000?Math.floor(info.age/60000)+'p trước':'h trước';
    el.innerHTML='<span class="save-dot ok"></span>Ngày '+info.day+' · '+ageStr;
  }else{
    el.innerHTML='<span class="save-dot warn"></span>Chưa lưu';
  }
}

function refreshAll(){
  const activeTab=document.querySelector('#tab-nav button.active');
  if(activeTab)switchTab(activeTab.dataset.tab);
  renderStats();renderLog();updateSaveInfo();
}

function showModal(title,body){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div style="margin-top:16px;text-align:right"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button></div></div></div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

function processCafeDaily(){
  const era=game.eraIdx;let income=0;
  game.stations.forEach(st=>{if(!st.pc)return;const pc=game.pcs.find(p=>p.id===st.pc);if(pc)income+=Math.round(pc.perf*2.5*game.cafePricePerHour/5);});
  income=Math.round(income*getEventCafeModifier());
  game.stations.forEach(st=>{
    if(!st.pc)return;
    const pc=game.pcs.find(p=>p.id===st.pc);
    if(pc&&pc.hasDefect){
      const breakChance=0.15;
      if(Math.random()<breakChance){
        st.pc=null;
        game.reputation=Math.max(0,game.reputation-3);
        pushLog('PC #'+Math.round(pc.id)+' tại máy '+st.id+' SỬA CỐ do linh kiện hỏng! Khách phàn nàn. -3 uy tín','err');
        showToast('Sự cố tại máy '+st.id+'! Linh kiện hỏng gây sập','err');
      }
    }
  });
  const elecReduce=getEmployeeEffect('elecReduce');
  const elec=game.stations.filter(s=>s.pc).length*ELECTRICITY_RATE*Math.round(50+era*30)*(1-elecReduce);
  const rent=CAFE_RENT*game.cafeExpandCount/6;
  game.money+=income-elec-rent;
  game.cafeMonthlyBill+=elec;game.cafeDaysInMonth++;
  if(game.cafeDaysInMonth>=30){if(game.cafeMonthlyBill>0)pushLog('Hóa đơn điện tháng: -'+fmtMoney(Math.round(game.cafeMonthlyBill*0.3)),'warn');game.money-=game.cafeMonthlyBill*0.3;game.cafeMonthlyBill=0;game.cafeDaysInMonth=0;}
  const activeStations=game.stations.filter(s=>s.pc).length;
  const avgStationTemp=activeStations>0?game.stations.filter(s=>s.pc).reduce((sum,st,idx)=>{const pc=game.pcs.find(p=>p.id===st.pc);if(!pc)return sum;const pcBuild={cpu:pc.cpu,gpu:pc.gpu,ram:pc.ram,mb:pc.mb};return sum+getAvgTemp(pcBuild);},0)/activeStations:0;
  if(game.cafePricePerHour>15&&Math.random()<(game.cafePricePerHour-15)*0.03){const li=game.stations.findIndex(s=>s.pc);if(li>=0){game.stations[li].pc=null;pushLog('Khách rời đi vì giá quá cao!','err');showToast('Khách bỏ máy vì giá cao!','err');}}
  if(avgStationTemp>85&&Math.random()<0.05){const li=game.stations.findIndex(s=>s.pc);if(li>=0){game.stations[li].pc=null;pushLog('Khách rời đi vì máy quá nóng!','err');showToast('Máy nóng quá, khách bỏ đi!','err');}}
  if(income>0)pushLog('Phòng NET: +'+fmtMoney(income)+' thu, -'+fmtMoney(elec+rent)+' chi','info');
}

function advanceDay(){
  if(game.gameOver)return;
  processShipments();processCafeDaily();processAutoRepair();processEmployeeSalaries();updateStocks();
  if(game.day%2===0)updateCompetitors();
  updateAiBrands();updateRndProjects();
  game.partners.forEach(p=>{if(p.cooldown>0)p.cooldown--;});
  updateEndgame();
  updateNews();
  updateEvents();
  updateContracts();
  if(isBuildComplete(game.build)){
    applyHardwareWear(game.build);
    const fail=checkThermalFailure(game.build);
    if(fail){pushLog('Hỏng '+CAT_LABELS[fail.cat]+' do nhiệt độ '+fail.temp+'°C!','err');showToast('Hỏng '+CAT_LABELS[fail.cat]+' do nhiệt!','err');game.build[fail.cat]=null;}
    const stab=getStabilityScore(game.build);
    if(stab<20&&Math.random()<(20-stab)*0.02){pushLog('Sập xung! PC tự reset do ép xung quá mức.','err');showToast('Sập xung! Giảm xung ngay!','err');game.overclock={...OC_DEFAULTS};}
    const ocWatt=getOverclockedWatt(game.build),psuMax=getPSUMaxWatt(game.build);
    if(psuMax>0&&ocWatt>psuMax&&Math.random()<0.1){pushLog('PSU quá tải! PC tắt ngúm.','err');showToast('PSU bảo vệ ngắt điện!','err');}
  }
  game.day++;
  const newEraIdx=Math.floor((game.day-1)/DAYS_PER_ERA);
  if(newEraIdx>game.eraIdx&&newEraIdx<ERAS.length){game.eraIdx=newEraIdx;pushLog('Bước vào kỷ nguyên mới: '+ERAS[newEraIdx].name+'!','ok');showToast('Kỷ nguyên mới: '+ERAS[newEraIdx].name+'!','ok');game.reputation+=10;game.marketShare=Math.min(60,game.marketShare+2);}
  if(newEraIdx>=ERAS.length){game.eraIdx=ERAS.length-1;pushLog('Kỷ nguyên kéo dài - Endgame vô cực!','warn');}
  if(Math.random()<0.5)generateOrders(1);
  if(game.orders.length<2)generateOrders(1);
  if(Math.random()<0.4)generateRepairs(1);
  if(game.repairs.length<1)generateRepairs(1);
  if(game.day%3===0)game.reputation+=1;
  if(game.money<0){const ts=game.stocks.find(s=>s.id==='TECH');if(ts)ts.price=Math.max(1,ts.price*0.9);}
  if(game.money<0&&!game.gameOver){pushLog('Phá sản! Trò chơi kết thúc.','err');showToast('Game Over! Bạn đã phá sản.','err');game.gameOver=true;}
  if(game.gameOver){showModal('GAME OVER',"<div style='text-align:center;font-size:18px;padding:20px'>Bạn đã phá sản sau "+game.day+" ngày kinh doanh!<br><br><button class='btn btn-p' onclick='restartGame()'>Chơi lại từ đầu</button></div>");return;}
  const _active=document.querySelector('#tab-nav button.active');
  if(_active)renderTab(_active.dataset.tab);
  saveGame(true);
  updateSaveInfo();
}

function restartGame(){
  closeModal();
  deleteSave();
  while(CATALOG.length&&CATALOG[CATALOG.length-1]&&(CATALOG[CATALOG.length-1].crafted||CATALOG[CATALOG.length-1].aiMade))CATALOG.pop();
  initGame();switchTab('cafe');renderStats();renderLog();updateSaveInfo();showToast('Chơi lại từ đầu! Chúc may mắn.','info');
}

function init(){
  const loaded=hasSaveData()?loadGame():false;
  if(!loaded) initGame();
  document.querySelectorAll('#tab-nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  renderCafe();renderStats();renderLog();
  const advBtn=document.createElement('button');
  advBtn.className='btn btn-p';advBtn.textContent='Bước sang ngày tiếp theo →';
  advBtn.style.cssText='position:fixed;bottom:20px;right:20px;z-index:500;box-shadow:0 4px 12px rgba(0,0,0,.4)';
  advBtn.onclick=advanceDay;document.body.appendChild(advBtn);
  const savePanel=document.createElement('div');
  savePanel.className='save-panel';
  savePanel.innerHTML='<button class="btn btn-ghost btn-sm" onclick="showSaveLoadModal()">💾 Save/Load</button><span class="save-info" id="save-info-text"></span>';
  document.body.appendChild(savePanel);
  startAutoSave();
  updateSaveInfo();
  if(loaded)switchTab('cafe');
}
init();
</script>
</body>
</html>
