<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Empire Manager - Ông Trùm Công Nghệ</title>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--bg3:#1a2235;--card:#162032;--card2:#1e293f;--border:#2a3a55;--border2:#36507a;--p:#2dd4bf;--p2:#14b8a6;--p-dim:#0d9488;--s:#3b82f6;--s2:#2563eb;--s-dim:#1d4ed8;--ac:#f59e0b;--ac2:#d97706;--ok:#22c55e;--ok2:#16a34a;--warn:#f97316;--warn2:#ea580c;--err:#ef4444;--err2:#dc2626;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#64748b;--radius:10px;--gap:12px;--font:'Segoe UI',system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.btn{padding:8px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:var(--font);color:#fff;background:var(--s)}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-p{background:var(--p)}.btn-ok{background:var(--ok)}.btn-warn{background:var(--warn)}.btn-err{background:var(--err)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--txt2)}
.btn-ghost:hover{border-color:var(--p);color:var(--p)}
input,select{padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--txt);font-family:var(--font);font-size:13px}
input:focus,select:focus{outline:none;border-color:var(--p)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge-era{background:var(--s-dim);color:#bfdbfe}.badge-ok{background:rgba(34,197,94,.2);color:var(--ok)}
.badge-warn{background:rgba(249,115,22,.2);color:var(--warn)}.badge-err{background:rgba(239,68,68,.2);color:var(--err)}
.badge-tier{background:var(--bg3);color:var(--txt2)}
#game{max-width:1400px;margin:0 auto;padding:10px}
header.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;margin-bottom:10px}
.topbar h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;min-width:80px}
.stat .v{font-size:18px;font-weight:800}.stat .l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.stat.money .v{color:var(--ok)}.stat.day .v{color:var(--s)}.stat.era .v{color:var(--ac);font-size:14px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
nav.tabs button{padding:9px 14px;border:none;border-bottom:3px solid transparent;background:var(--bg2);color:var(--txt2);cursor:pointer;font-size:13px;font-weight:600;border-radius:7px 7px 0 0;transition:all .15s;font-family:var(--font)}
nav.tabs button:hover{color:var(--txt);background:var(--bg3)}
nav.tabs button.active{color:var(--p);border-bottom-color:var(--p);background:var(--card)}
.tab-content{display:none;animation:fadeIn .2s}.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;gap:var(--gap)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow:hidden}
.card h3{font-size:15px;margin-bottom:10px;color:var(--txt);display:flex;align-items:center;gap:8px}
.card .sub{font-size:12px;color:var(--txt3);margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:border-color .15s}
.item:hover{border-color:var(--border2)}
.item .info{flex:1;min-width:0}
.item .name{font-weight:600;font-size:13px}
.item .meta{font-size:11px;color:var(--txt3);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.item .price{font-weight:700;color:var(--ok);font-size:13px;white-space:nowrap}
.item .watt{color:var(--warn)}
.item-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.slot{background:var(--card2);border:2px dashed var(--border);border-radius:10px;padding:14px;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:all .2s;cursor:pointer}
.slot:hover{border-color:var(--p);background:rgba(45,212,191,.05)}
.slot.filled{border-style:solid;border-color:var(--p-dim);background:rgba(45,212,191,.08)}
.slot .slot-label{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.slot .slot-name{font-size:13px;font-weight:600}
.slot .slot-watt{font-size:11px;color:var(--warn);margin-top:2px}
.slot .slot-empty{font-size:12px;color:var(--txt3)}
.slot .remove{color:var(--err);font-size:11px;cursor:pointer;margin-top:4px}
.slot .remove:hover{text-decoration:underline}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.station{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:14px}
.station .st-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.station .st-id{font-weight:700;font-size:13px}
.station .st-pc{font-size:12px;color:var(--txt2);margin-bottom:6px}
.station .st-income{font-size:12px}
.income-good{color:var(--ok)}.income-bad{color:var(--err)}.income-idle{color:var(--txt3)}
.log{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.log-entry{font-size:12px;padding:5px 10px;border-radius:6px;background:var(--bg2);border-left:3px solid var(--border)}
.log-entry.ok{border-color:var(--ok)}.log-entry.err{border-color:var(--err)}.log-entry.warn{border-color:var(--warn)}.log-entry.info{border-color:var(--s)}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;animation:slideIn .2s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{background:var(--ok2);color:#fff}.toast.err{background:var(--err2);color:#fff}.toast.warn{background:var(--warn2);color:#fff}.toast.info{background:var(--s2);color:#fff}
.progress-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.seg{display:flex;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{padding:6px 12px;border:none;background:var(--bg);color:var(--txt2);cursor:pointer;font-size:12px;font-family:var(--font)}
.seg button.active{background:var(--s);color:#fff}
.empty-state{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px;color:var(--txt3);border-bottom:1px solid var(--border);font-weight:600}
td{padding:8px;border-bottom:1px solid var(--border)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:24px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.detail-grid .d-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.detail-grid .d-row .dl{color:var(--txt3)}.detail-grid .d-row .dv{font-weight:600}
.fps-display{text-align:center;padding:20px}
.fps-display .fps-num{font-size:48px;font-weight:900}
.fps-display .fps-label{font-size:13px;color:var(--txt3)}
.game-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;transition:all .15s}
.game-card:hover{border-color:var(--p)}
.game-card.selected{border-color:var(--p);box-shadow:0 0 0 2px rgba(45,212,191,.3)}

/* === Retro Browser === */
.browser-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.browser-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border)}
.browser-dot{width:10px;height:10px;border-radius:50%}
.browser-dot.r{background:#ff5f56}.browser-dot.y{background:#ffbd2e}.browser-dot.g{background:#27c93f}
.browser-url{flex:1;padding:5px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--txt2)}
.browser-content{padding:16px;max-height:520px;overflow-y:auto}
.search-box{width:100%;padding:12px 16px;background:var(--bg);border:2px solid var(--border);border-radius:24px;font-size:15px;color:var(--txt);margin-bottom:16px}
.search-box:focus{border-color:var(--p);outline:none}
.google-logo{font-size:28px;font-weight:800;text-align:center;margin:10px 0 20px;background:linear-gradient(90deg,var(--s),var(--p),var(--ac));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-result{padding:10px 0;border-bottom:1px solid var(--border)}
.search-result .sr-title{font-size:14px;color:var(--s);cursor:pointer;font-weight:600}
.search-result .sr-title:hover{text-decoration:underline}
.search-result .sr-url{font-size:11px;color:var(--ok)}
.search-result .sr-desc{font-size:12px;color:var(--txt2);margin-top:2px}
.wiki-page{font-size:13px;line-height:1.7}
.wiki-page h4{font-size:16px;color:var(--p);margin-bottom:8px}
.wiki-page .wiki-spec{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0}
.wiki-page .wiki-spec .ws-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.wiki-page .wiki-spec .ws-row:last-child{border-bottom:none}
.wiki-page .ws-label{color:var(--txt3)}.wiki-page .ws-val{font-weight:600}
/* === Competitors === */
.comp-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px;transition:border-color .2s}
.comp-card:hover{border-color:var(--border2)}
.comp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.comp-name{font-weight:700;font-size:14px}
.comp-status{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.comp-status.rising{background:rgba(34,197,94,.2);color:var(--ok)}
.comp-status.falling{background:rgba(239,68,68,.2);color:var(--err)}
.comp-status.stable{background:rgba(59,130,246,.2);color:var(--s)}
.comp-status.stuck{background:rgba(249,115,22,.2);color:var(--warn)}
.comp-status.leader{background:rgba(45,212,191,.2);color:var(--ac)}
.brand-link{color:var(--p);cursor:pointer;text-decoration:none;transition:color .15s}
.brand-link:hover{color:var(--ac);text-decoration:underline}
.comp-bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin:6px 0}
.comp-bar .fill{height:100%;border-radius:5px;transition:width .5s}
.comp-meta{font-size:11px;color:var(--txt3);display:flex;gap:12px;margin-top:4px}
/* === Partners === */
.partner-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:8px}
.partner-logo{font-size:18px;font-weight:800;margin-bottom:4px}
.partner-status{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.partner-status.active{background:rgba(34,197,94,.2);color:var(--ok)}
.partner-status.pending{background:rgba(245,158,11,.2);color:var(--ac)}
.partner-status.none{background:rgba(100,116,139,.2);color:var(--txt3)}
.disc-amount{font-size:20px;font-weight:800;color:var(--ok)}
/* === R&D === */
.rnd-recipe{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.rnd-recipe h4{font-size:14px;margin-bottom:8px}
.rnd-progress{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.rnd-progress .fill{height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:6px;transition:width .3s}
.crafted-item{background:rgba(45,212,191,.08);border:1px solid var(--p-dim);border-radius:8px;padding:12px;margin-bottom:8px}
.crafted-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;background:var(--p-dim);color:#fff;margin-left:6px}
.custom-stat{display:flex;align-items:center;gap:8px;margin:6px 0}
.custom-stat label{min-width:100px;font-size:12px;color:var(--txt3)}
.custom-stat input{width:120px}
.cost-display{font-size:13px;font-weight:700;color:var(--ac);margin-top:8px}
/* === Endgame === */
.endgame-banner{background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(45,212,191,.15));border:1px solid var(--ac);border-radius:10px;padding:16px;margin-bottom:12px;text-align:center}
.endgame-banner h3{color:var(--ac);font-size:18px;margin-bottom:4px}
.ai-threat{background:rgba(239,68,68,.08);border:1px solid var(--err);border-radius:8px;padding:12px;margin-bottom:8px}
.ai-threat .ai-name{font-weight:700;color:var(--err);font-size:14px}
.ai-threat .ai-spec{font-size:12px;color:var(--txt2);margin-top:4px}
.tech-level-bar{height:16px;background:var(--bg);border-radius:8px;overflow:hidden;margin:8px 0}
.tech-level-bar .fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--p));border-radius:8px;transition:width .5s}
.reputation-display{font-size:22px;font-weight:800}
.rep-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.rep-bar .fill{height:100%;background:linear-gradient(90deg,var(--warn),var(--ok));border-radius:4px;transition:width .3s}

/* === Overclock Panel === */
.oc-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:10px}
.oc-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.oc-row label{min-width:100px;font-size:12px;color:var(--txt3)}
.oc-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:var(--bg);border-radius:3px;outline:none}
.oc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--p);cursor:pointer}
.oc-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--p);cursor:pointer;border:none}
.oc-value{min-width:60px;text-align:right;font-weight:700;font-size:13px}
/* === Temperature Gauge === */
.temp-gauge{position:relative;width:100%;height:24px;background:var(--bg);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.temp-fill{height:100%;border-radius:12px;transition:width .4s,background .4s}
.temp-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700;text-shadow:0 0 4px rgba(0,0,0,.8)}
.temp-zone{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.temp-zone.safe{background:rgba(34,197,94,.2);color:var(--ok)}
.temp-zone.warm{background:rgba(245,158,11,.2);color:var(--ac)}
.temp-zone.hot{background:rgba(249,115,22,.2);color:var(--warn)}
.temp-zone.critical{background:rgba(239,68,68,.2);color:var(--err)}
.cooling-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600}
.cooling-badge.air{background:rgba(59,130,246,.15);color:var(--s)}
.cooling-badge.aio{background:rgba(45,212,191,.15);color:var(--p)}
.cooling-badge.custom{background:rgba(168,85,247,.15);color:#a855f7}
/* === Graphics Settings === */
.gfx-seg{display:flex;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:12px}
.gfx-seg button{flex:1;padding:7px 10px;border:none;background:var(--bg);color:var(--txt2);cursor:pointer;font-size:11px;font-family:var(--font);transition:all .15s}
.gfx-seg button.active{background:var(--p);color:#0a0e17;font-weight:700}
.gfx-seg button:hover:not(.active){background:var(--bg3);color:var(--txt)}
/* === Device Builder === */
.device-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s}
.device-card:hover{border-color:var(--p);transform:translateY(-2px)}
.device-card.selected{border-color:var(--p);box-shadow:0 0 0 2px rgba(45,212,191,.3)}
.device-icon{font-size:32px;text-align:center;margin-bottom:8px}
.device-name{font-weight:700;text-align:center;font-size:14px}
.device-desc{font-size:11px;color:var(--txt3);text-align:center;margin-top:4px}
/* === Staff/Stock === */
.staff-card{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px}
.staff-role{font-weight:700;font-size:13px}
.staff-salary{color:var(--err);font-size:12px}
.staff-bonus{color:var(--ok);font-size:11px}
.stock-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg2);border-radius:6px;margin-bottom:4px;font-size:12px}
.stock-ticker{font-weight:700;font-size:13px}
.stock-change{font-weight:700;font-size:12px}
.stock-up{color:var(--ok)}.stock-down{color:var(--err)}
/* === Cafe Pricing === */
.cafe-control{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px}
.cafe-stat-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.cafe-stat-row:last-child{border-bottom:none}
.cafe-expand-btn{font-size:11px;color:var(--s);cursor:pointer;border:none;background:none}
/* === News Feed === */
.news-feed{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto}
.news-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;transition:all .2s;animation:fadeIn .3s}
.news-item:hover{border-color:var(--border2)}
.news-item.unread{border-left:3px solid var(--p)}
.news-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px}
.news-title{font-weight:700;font-size:13px;flex:1}
.news-date{font-size:11px;color:var(--txt3);white-space:nowrap}
.news-body{font-size:12px;color:var(--txt2);line-height:1.6}
.news-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;margin-right:4px}
.news-tag.market{background:rgba(59,130,246,.2);color:var(--s)}
.news-tag.product{background:rgba(245,158,11,.2);color:var(--ac)}
.news-tag.policy{background:rgba(168,85,247,.15);color:#a855f7}
.news-tag.crisis{background:rgba(239,68,68,.2);color:var(--err)}
.news-tag.opportunity{background:rgba(34,197,94,.2);color:var(--ok)}
.news-impact{font-size:11px;color:var(--txt3);margin-top:4px;font-style:italic}
.news-filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.news-filter button{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--bg2);color:var(--txt2);cursor:pointer;font-size:11px;font-family:var(--font);transition:all .15s}
.news-filter button.active{background:var(--p);color:#0a0e17;font-weight:700;border-color:var(--p)}
.news-filter button:hover:not(.active){border-color:var(--p);color:var(--p)}
.news-stats{display:flex;gap:16px;padding:10px 14px;background:var(--bg2);border-radius:8px;margin-bottom:12px}
.news-stat{display:flex;flex-direction:column;align-items:center}
.news-stat .v{font-size:20px;font-weight:800;color:var(--s)}
.news-stat .l{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
/* === Random Events === */

const MAX_ACTIVE_AI_BRANDS=12;
const AI_BRAND_POOL=['APEX','NEXUS','TITAN','QUANTUM','OMEGA','PRIME','STELLAR','PHANTOM','HYPER','GENESIS','CYPRESS','VOLT','ZENITH','KRAKEN','PULSE','NOVA','CIPHER','VORTEX','PIONEER','ECLIPSE','SYNAPSE','COBALT','FUSION','PHOTON','RIVET'];
let _aiBrandIdCounter=0;
function initAiBrands(){
  _aiBrandIdCounter=0;
  return AI_BRAND_NAMES.slice(0,5).map((name,i)=>{
    _aiBrandIdCounter++;
    return {
      id:_aiBrandIdCounter, name, cat:AI_BRAND_CATS[i%AI_BRAND_CATS.length],
      techLevel:10+i*5, rndProgress:0, rndInterval:8+i*2,
      lastRndDay:0,
      share:8+i*2, revenue:3000+i*1500, status:'stable',
      bankrupt:false, foundedDay:1, daysActive:0,
    };
  });
}
function spawnAiBrand(){
  if(game.aiBrands.filter(b=>!b.bankrupt).length>=MAX_ACTIVE_AI_BRANDS)return;
  const used=game.aiBrands.map(b=>b.name);
  const available=AI_BRAND_POOL.filter(n=>!used.includes(n));
  if(!available.length)return;
  const name=available[Math.floor(Math.random()*available.length)];
  const cat=AI_BRAND_CATS[Math.floor(Math.random()*AI_BRAND_CATS.length)];
  _aiBrandIdCounter++;
  const brand={
    id:_aiBrandIdCounter, name, cat,
    techLevel:5+Math.floor(Math.random()*20)+game.eraIdx*3,
    rndProgress:0, rndInterval:6+Math.floor(Math.random()*6),
    lastRndDay:game.day,
    share:3+Math.floor(Math.random()*5),
    revenue:1000+Math.floor(Math.random()*3000),
    status:'rising', bankrupt:false, foundedDay:game.day, daysActive:0,
  };
  game.aiBrands.push(brand);
  pushLog('[Google ảo] Hãng mới '+name+' gia nhập thị trường!','info');
  showToast('Hãng AI mới: '+name+' xuất hiện!','info');
}
function processAiBrandLifeCycle(){
  const active=game.aiBrands.filter(b=>!b.bankrupt);
  for(let i=active.length-1;i>=0;i--){
    const b=active[i];
    b.daysActive++;
    const roll=Math.random();
    if(b.status==='rising'){
      b.share+=0.3+Math.random()*0.8;
      b.revenue+=Math.round(Math.random()*800);
      if(roll<0.12){b.status='falling';}
      else if(roll<0.22){b.status='stable';}
    }else if(b.status==='falling'){
      b.share-=0.5+Math.random()*1.2;
      b.revenue=Math.max(200,b.revenue-Math.round(Math.random()*1200));
      if(roll<0.15){b.status='stable';}
    }else if(b.status==='stuck'){
      b.share-=0.3;
      b.revenue=Math.max(200,b.revenue-Math.round(Math.random()*600));
      if(roll<0.2){b.status='rising';pushLog(b.name+' phục hồi sau bế tắc!','ok');}
    }else{
      if(roll<0.15){b.status='rising';b.share+=0.5;}
      else if(roll<0.25){b.status='falling';b.share-=0.3;}
      else{b.share+=0.1;b.revenue+=Math.round(Math.random()*400);}
    }
    b.share=Math.max(0.5,Math.min(40,b.share));
    if(b.share<2 && b.daysActive>10){
      b.bankrupt=true;
      const removed=garbageCollectBrand(b.name);
      pushLog('[Google ảo] '+b.name+' PHÁ SẢN! Bị loại khỏi bảng xếp hạng. '+removed+' linh kiện ngừng bán.','err');
      showToast(b.name+' phá sản! '+removed+' linh kiện ngừng bán.','warn');
    }
  }
  // Mark leader
  const aliveBrands=game.aiBrands.filter(b=>!b.bankrupt);
  if(aliveBrands.length){const top=Math.max(...aliveBrands.map(b=>b.share));aliveBrands.forEach(b=>{if(b.share===top&&b.share>=15)b.status='leader';else if(b.status==='leader')b.status='stable';});}
  if(game.aiBrands.length>40){
    game.aiBrands=game.aiBrands.filter(b=>!b.bankrupt);
  }
  const alive=aliveBrands.length;
  if(alive<MAX_ACTIVE_AI_BRANDS && Math.random()<0.3){
    spawnAiBrand();
  }
}

function garbageCollectBrand(brandName){
  const beforeLen=CATALOG.length;
  for(let i=CATALOG.length-1;i>=0;i--){
    if(CATALOG[i].aiMade&&CATALOG[i].brand===brandName)CATALOG.splice(i,1);
  }
  return beforeLen-CATALOG.length;
}

function calcPCWatt(build){
  let w=0;
  for(const cat of POWER_DRAW_CATS){
    const id=build[cat]; if(!id) continue;
    const it=getItemById(id); if(it && it.watt) w+=it.watt;
  }
  return w;
}

function getPSUMaxWatt(build){
  const id=build.psu; if(!id) return 0;
  const it=getItemById(id); if(!it) return 0;
  return it.watt||0;
}

function calcPCPerf(build){
  if(!build.cpu||!build.gpu||!build.mb||!build.ram) return 0;
  const cpu=getItemById(build.cpu), gpu=getItemById(build.gpu),
        mb=getItemById(build.mb), ram=getItemById(build.ram);
  if(!cpu||!gpu||!mb||!ram) return 0;
  const mbTier=mb.tier||1;
  let perf = (cpu.perf*0.38 + gpu.perf*0.38 + mbTier*2.5*0.05 + ram.perf*0.1 + (mbTier>=3?5:0));
  const psuMax=getPSUMaxWatt(build), draw=calcPCWatt(build);
  if(psuMax>0 && draw>psuMax){
    perf *= Math.max(0.3, psuMax/draw);
  }
  return Math.round(perf);
}

function isBuildComplete(build){
  return CAT_SLOTS.every(c=>build[c]);
}

function isBuildValid(build){
  if(!isBuildComplete(build)) return false;
  const psuMax=getPSUMaxWatt(build), draw=calcPCWatt(build);
  return psuMax>=draw;
}

// ============ OVERCLOCKING ============
function getOverclockedPerf(build){
  const base=calcPCPerf(build);
  const oc=game.overclock;
  const cpu=getItemById(build.cpu), gpu=getItemById(build.gpu);
  let perf=base;
  if(cpu){
    const cpuBoost=(oc.cpuMul-1)*0.5;
    perf+=cpu.perf*cpuBoost;
  }
  if(gpu){
    const gpuBoost=(oc.gpuMul-1)*0.5;
    perf+=gpu.perf*gpuBoost;
  }
  return Math.round(perf);
}

function getOverclockedWatt(build){
  const base=calcPCWatt(build);
  const oc=game.overclock;
  const cpu=getItemById(build.cpu), gpu=getItemById(build.gpu), ram=getItemById(build.ram);
  let watt=base;
  if(cpu) watt+=cpu.watt*(oc.cpuMul-1)*(1+oc.cpuV*0.3);
  if(gpu) watt+=gpu.watt*(oc.gpuMul-1)*(1+oc.gpuV*0.3);
  if(ram) watt+=ram.watt*(oc.ramMul-1)*0.5;
  return Math.round(watt);
}

// ============ TEMPERATURE & COOLING ============
function calcComponentTemp(build,cat){
  const id=build[cat]; if(!id) return 0;
  const it=getItemById(id); if(!it) return 0;
  const oc=game.overclock;
  let baseTemp=45;
  const watt=it.watt||0;
  baseTemp+=watt*0.15;
  if(cat==='cpu'){
    baseTemp+=(oc.cpuMul-1)*30*(1+oc.cpuV*0.5);
  } else if(cat==='gpu'){
    baseTemp+=(oc.gpuMul-1)*25*(1+oc.gpuV*0.5);
  } else if(cat==='ram'){
    baseTemp+=(oc.ramMul-1)*10;
  }
  const cooling=getCoolingById(game.buildCooling);
  if(cooling){
    if(baseTemp>cooling.capacity){
      baseTemp=cooling.capacity+(baseTemp-cooling.capacity)*1.5;
    } else {
      baseTemp-=Math.max(0,(cooling.capacity-baseTemp)*0.05);
    }
  }
  return Math.round(Math.max(30,baseTemp));
}

function getCoolingById(id){
  return COOLING_TYPES.find(c=>c.id===id);
}

function getAvgTemp(build){
  const cats=['cpu','gpu','ram'];
  let total=0,count=0;
  cats.forEach(c=>{if(build[c]){total+=calcComponentTemp(build,c);count++;}});
  return count?Math.round(total/count):0;
}

function getTempZone(temp){
  if(temp<60) return {label:'An toàn',cls:'safe',color:'var(--ok)'};
  if(temp<75) return {label:'Ấm',cls:'warm',color:'var(--ac)'};
  if(temp<90) return {label:'Nóng',cls:'hot',color:'var(--warn)'};
  return {label:'Nguy hiểm',cls:'critical',color:'var(--err)'};
}

function checkThermalFailure(build){
  const cats=['cpu','gpu'];
  for(const c of cats){
    if(!build[c]) continue;
    const t=calcComponentTemp(build,c);
    if(t>=95){
      const failChance=Math.min(0.8,(t-95)/20);
      if(Math.random()<failChance) return {cat,temp:t};
    }
  }
  return null;
}

function getCoolingForEra(era){
  return COOLING_TYPES.filter(c=>c.e<=era);
}

// ============ FPS CALCULATION WITH GRAPHICS SETTINGS ============
function calcFPS(build,gameKey,gfxKey){
  const g=GAME_LIBRARY[gameKey]; if(!g) return 0;
  const gfx=GFX_SETTINGS[gfxKey]; if(!gfx) return 0;
  if(!isBuildComplete(build)) return 0;
  const perf=getOverclockedPerf(build);
  const throttle=getPSUMaxWatt(build)>0&&getOverclockedWatt(build)>getPSUMaxWatt(build)
    ?Math.max(0.3,getPSUMaxWatt(build)/getOverclockedWatt(build)):1;
  const thermalFail=checkThermalFailure(build);
  const thermalPenalty=thermalFail?0.5:1;
  const thermalThrottle=getThermalThrottle(build);
  const cpuItem=getItemById(build.cpu), ramItem=getItemById(build.ram);
  const cpuP=cpuItem?cpuItem.perf:0, ramP=ramItem?ramItem.perf:0;
  const gpuP=Math.max(0,perf-cpuP*0.38-ramP*0.1);
  const weighted=cpuP*g.cpuW+gpuP*g.gpuW+ramP*g.ramW;
  const fps=Math.round(weighted*throttle*thermalThrottle*thermalPenalty*gfx.perfMult*1.2+15);
  return Math.max(1,fps);
}

// ============ DEVICE CALCULATIONS ============
function calcDevicePerf(deviceBuild){
  const dt=DEVICE_TYPES.find(d=>d.id===deviceBuild.type);
  if(!dt) return 0;
  let total=0,components=0;
  dt.slotCats.forEach(cat=>{
    const id=deviceBuild[cat]; if(!id) return;
    const it=getItemById(id); if(it){total+=it.perf;components++;}
  });
  return components?Math.round(total/components):0;
}

function calcDeviceCost(deviceBuild){
  let cost=0;
  Object.values(deviceBuild).forEach(id=>{
    if(!id||id==='laptop'||id==='mobile'||id==='tablet') return;
    const it=getItemById(id); if(it) cost+=it.cost;
  });
  return cost;
}

function isDeviceComplete(deviceBuild){
  const dt=DEVICE_TYPES.find(d=>d.id===deviceBuild.type);
  if(!dt) return false;
  return dt.slotCats.every(c=>deviceBuild[c]);
}

// ============ EMPLOYEE EFFECTS ============
function getEmployeeEffect(effectType){
  let mult=0;
  game.employees.forEach(e=>{
    const et=EMPLOYEE_TYPES.find(t=>t.id===e.role);
    if(et&&et.effect===effectType) mult+=et.mult*(e.level||1);
  });
  return mult;
}

function hasEmployee(effectType){
  return game.employees.some(e=>{
    const et=EMPLOYEE_TYPES.find(t=>t.id===e.role);
    return et&&et.effect===effectType;
  });
}

function getBuildCost(build){
  let c=0;
  for(const cat of CAT_SLOTS){
    const id=build[cat]; if(!id) continue;
    const it=getItemById(id); if(it){
      const disc=getPartnerDiscount(it.cat);
      c+=disc>0?Math.round(it.cost*(1-disc)):it.cost;
    }
  }
  return c;
}

function attachStation(id){
  const sel=document.getElementById('station-'+id);
  if(!sel||!sel.value) return;
  const st=game.stations.find(s=>s.id===id);
  if(!st)return;
  st.pc=parseInt(sel.value);
  pushLog(`Gắn PC #${sel.value} vào máy ${id}`,'ok');
  renderCafe(); renderStats();
}
function detachStation(id){
  const st=game.stations.find(s=>s.id===id);
  if(!st)return;
  st.pc=null;
  pushLog(`Gỡ PC khỏi máy ${id}`,'info');
  renderCafe();
}

function generateOrders(n){
  for(let i=0;i<n;i++) game.orders.push(generateOrder());
}
function generateOrder(){
  const era=game.eraIdx;
  const cats=['cpu','gpu','mb','ram','psu','case','storage'];
  const req={};
  const targetTier=1+Math.floor(Math.random()*Math.min(4,1+era));
  cats.forEach(c=>{
    const items=getByCat(c,era).filter(p=>p.tier<=targetTier+1);
    if(items.length){
      const pick=items[Math.floor(Math.random()*items.length)];
      req[c]=pick.id;
    }
  });
  const perf=calcPCPerf(req);
  const budget=Math.round(getBuildCost(req)*1.3+perf*10);
  const types=['Game thủ','Văn phòng','Đồ họa','Streamer','Học sinh'];
  return {id:Date.now()+Math.random(),name:types[Math.floor(Math.random()*types.length)],req,budget,perf_min:Math.max(1,perf-10),day_created:game.day,status:'pending',acceptedDay:0};
}

  if(!game.orders.length){el.innerHTML='<div class="card empty-state">Chưa có đơn hàng nào. Đợi ngày mới để nhận thêm đơn.</div>';return;}
  const pending=game.orders.filter(o=>o.status==='pending');
  const accepted=game.orders.filter(o=>o.status==='accepted');
  let html='<div class="card"><h3>Nhiệm vụ khách hàng</h3>';
  html+='<div class="sub">Nhận đơn → Ráp PC ở tab Ráp PC → Lưu vào Kho PC → Chọn PC từ kho để giao hàng. Chỉ nhận tiền khi giao thành công!</div>';
  if(accepted.length){
    html+='<h4 style="margin:10px 0 6px;color:var(--ac)">Đơn đang chờ giao hàng ('+accepted.length+')</h4><div class="item-list">';
    accepted.forEach(o=>{

      html+='<div class="name">'+o.name+' - '+fmtMoney(o.budget)+' <span class="order-status-badge accepted">Đã nhận</span></div>';
      html+='<div class="meta">Perf tối thiểu: '+o.perf_min+' · PC phù hợp trong kho: '+matchingPCs.filter(p=>p.perf>=o.perf_min).length+'</div>';
      html+='</div><div class="row">';
      html+='<button class="btn btn-sm btn-ghost" onclick="showOrderDetail('+idx+')">Chi tiết</button>';
      html+='<button class="btn btn-sm btn-ok" onclick="deliverFromWarehouse('+idx+')" '+(matchingPCs.length?'':'disabled')+'>Giao từ kho</button>';
      html+='<button class="btn btn-sm btn-err" onclick="cancelOrder('+idx+')">Hủy</button>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  if(pending.length){
    html+='<h4 style="margin:14px 0 6px;color:var(--s)">Đơn hàng mới ('+pending.length+')</h4><div class="item-list">';
    pending.forEach(o=>{
      const idx=game.orders.indexOf(o);
      html+='<div class="item"><div class="info">';
      html+='<div class="name">'+o.name+' - Ngân sách: '+fmtMoney(o.budget)+'</div>';
      html+='<div class="meta">Perf tối thiểu: '+o.perf_min+' · Ngày '+o.day_created+'</div>';
      html+='</div><div class="row">';
      html+='<button class="btn btn-sm btn-ghost" onclick="showOrderDetail('+idx+')">Chi tiết</button>';
      html+='<button class="btn btn-sm btn-p" onclick="acceptOrder('+idx+')">Nhận đơn</button>';
      html+='<button class="btn btn-sm btn-err" onclick="rejectOrder('+idx+')">Từ chối</button>';

}

function showOrderDetail(idx){
  const o=game.orders[idx]; if(!o) return;
  let html=`<div class="detail-grid">`;
  CAT_SLOTS.forEach(c=>{
    const it=getItemById(o.req[c]);
    html+=`<div class="d-row"><span class="dl">${CAT_LABELS[c]}</span><span class="dv">${it?it.n:'-'}</span></div>`;
  });
  html+=`</div><div style="margin-top:12px"><b>Ngân sách:</b> ${fmtMoney(o.budget)} · <b>Perf tối thiểu:</b> ${o.perf_min}</div>`;
  showModal('Chi tiết đơn hàng',html);
}

function acceptOrder(idx){
  const o=game.orders[idx]; if(!o) return;
  if(o.status!=='pending')return;
  o.status='accepted';
  o.acceptedDay=game.day;
  pushLog('Nhận đơn hàng '+o.name+' ('+fmtMoney(o.budget)+'). Ráp PC và giao từ Kho PC!','info');
  showToast('Đã nhận đơn! Ráp PC rồi giao từ Kho PC','ok');
  renderOrders();
}
function cancelOrder(idx){
  const o=game.orders[idx]; if(!o)return;
  if(o.status==='accepted'){
    game.reputation=Math.max(0,game.reputation-3);
    pushLog('Hủy đơn '+o.name+': -3 uy tín','warn');
    showToast('Hủy đơn hàng! -3 uy tín','warn');
  }
  game.orders.splice(idx,1);
  renderOrders();renderStats();
}
function deliverFromWarehouse(idx){
  const o=game.orders[idx]; if(!o||o.status!=='accepted')return;
  const avail=game.pcs.filter(p=>!game.stations.some(s=>s.pc===p.id)&&!p.assignedContract);
  if(!avail.length){showToast('Kho PC trống! Hãy ráp PC trước','err');return;}
  let html='<div class="sub">PC trong kho (Perf tối thiểu: '+o.perf_min+')</div><div class="item-list" style="max-height:350px">';
  avail.forEach(p=>{
    const meets=p.perf>=o.perf_min;
    html+='<div class="item"><div class="info">';
    html+='<div class="name">PC #'+Math.round(p.id)+' <span class="badge '+(meets?'badge-ok':'badge-err')+'">'+p.perf+' perf</span></div>';
    html+='<div class="meta">'+getPCSpecs(p)+' · Giá vốn '+fmtMoney(p.cost)+'</div>';
    html+='</div><button class="btn btn-sm btn-ok" onclick="confirmWarehouseDeliver('+idx+','+p.id+')">Giao</button></div>';
  });
  html+='</div>';
  showModal('Chọn PC giao cho '+o.name,html);
}
function confirmWarehouseDeliver(idx,pcId){
  const o=game.orders[idx]; if(!o)return;
  const pc=game.pcs.find(p=>p.id===pcId); if(!pc){closeModal();return;}
  const pcIdx=game.pcs.indexOf(pc);
  const meets=pc.perf>=o.perf_min;
  if(meets){
    game.money+=o.budget;
    game.reputation+=2;
    pushLog('Giao PC #'+Math.round(pcId)+' cho '+o.name+': +'+fmtMoney(o.budget)+', +2 uy tín','ok');
    showToast('Giao hàng thành công! +'+fmtMoney(o.budget),'ok');
  }else{
    const penalty=Math.round(o.budget*0.15);
    game.money-=penalty;
    game.reputation=Math.max(0,game.reputation-5);
    pushLog('PC #'+Math.round(pcId)+' không đạt perf cho '+o.name+': -'+fmtMoney(penalty)+', -5 uy tín','err');
    showToast('PC không đạt! Phạt '+fmtMoney(penalty),'err');
  }
  pc.assignedContract=pcId;
  game.pcs.splice(pcIdx,1);
  game.orders.splice(idx,1);
  closeModal();renderOrders();renderStats();renderWarehouse();
  saveGame(true);
}
function getPCSpecs(pc){
  if(!pc)return'';
  const cats=['cpu','gpu','mb','ram','psu','case','storage'];
  let parts=[];
  cats.forEach(c=>{
    if(pc[c]){const it=getItemById(pc[c]);if(it)parts.push(CAT_LABELS[c]+': '+it.n);}
  });
  return parts.slice(0,3).join(' · ');
}
function rejectOrder(idx){
  const o=game.orders[idx];if(!o)return;
  if(o.status!=='pending'){showToast('Không thể từ chối đơn đã nhận','err');return;}
  game.orders.splice(idx,1);
  pushLog('Từ chối đơn hàng','warn');
  renderOrders();
}

function processShipments(){
  for(let i=game.pendingShipments.length-1;i>=0;i--){
    const s=game.pendingShipments[i];
    s.daysLeft--;
    if(s.daysLeft<=0){
      game.stock.push({uid:s.uid,id:s.id,cost:s.cost,used:s.used,condition:s.condition,conditionLabel:s.conditionLabel,perfPenalty:s.perfPenalty});
      const it=getItemById(s.id);
      pushLog('Hàng đã giao: '+(it?it.n:s.id)+(s.used?' ['+s.conditionLabel+']':''),'ok');
      showToast('Hàng đã về kho: '+(it?it.n:''),'ok');
      game.pendingShipments.splice(i,1);
    }
  }
}

function getStockQuantities(){
  const q={};
  game.stock.forEach(s=>{
    const key=s.id;
    if(!q[key])q[key]={id:s.id,count:0,items:[]};
    q[key].count++;
    q[key].items.push(s);
  });
  return q;
}

function setMarketMode(m){S.marketMode=m;renderMarket();}

function buyItem(id,price,mode){
  const it=getItemById(id);
  if(!it) return;
  let finalPrice=price;
  if(mode!=='used'){
    const disc=getPartnerDiscount(it.cat);
    if(disc>0) finalPrice=Math.round(price*(1-disc));
    const pm=getActivePriceModifier();
    finalPrice=Math.round(finalPrice*pm);
  }
  if(game.money<finalPrice){showToast('Không đủ tiền','err');return;}
  game.money-=finalPrice;
  let condition='good',conditionLabel='Hoạt động tốt',perfPenalty=0;
  if(mode==='used'){
    const roll=Math.random();
    if(roll<0.55){condition='good';conditionLabel='Hoạt động tốt';perfPenalty=0;}
    else if(roll<0.85){condition='fair';conditionLabel='Hơi tã - giảm hiệu năng';perfPenalty=0.2;}
    else{condition='bad';conditionLabel='Lỗi/Hỏng nặng';perfPenalty=0.5;}
  }
  const shipDays=mode==='used'?1:2;
  const shipId=Date.now()+Math.random();
  game.pendingShipments.push({uid:shipId,id,cost:finalPrice,used:mode==='used',condition,conditionLabel,perfPenalty,daysLeft:shipDays,totalDays:shipDays});
  pushLog('Đặt mua '+it.n+' với '+fmtMoney(finalPrice)+' - giao trong '+shipDays+' ngày'+(mode==='used'?' ['+conditionLabel+']':''),'info');
  if(mode==='used'&&condition==='bad'){
    showToast('Mua phải hàng hỏng! '+it.n+' (đang giao)','err');
  }else if(mode==='used'&&condition==='fair'){
    showToast('Đặt mua '+it.n+' [Hơi tã] - giao '+shipDays+' ngày','warn');
  }else{
    showToast('Đã đặt mua '+it.n+' - giao trong '+shipDays+' ngày','ok');
  }
  game.totalRevenue+=finalPrice;
  renderMarket(); renderStats();
  saveGame(true);
}

function generateRepairs(n){
  for(let i=0;i<n;i++) game.repairs.push(generateRepair());
}
function generateRepair(){
  const era=game.eraIdx;
  const cats=['cpu','gpu','mb','ram','psu','case','storage','laptop','mobile','tablet'];
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const items=getByCat(cat,era);
  if(!items.length) return generateRepair();
  const it=items[Math.floor(Math.random()*items.length)];
  const issues=['Lỗi nguồn','Quạt hỏng','Bios lỗi','Overheat','Lỗi RAM','Hỏng tụ','Nguồn chập','Socket gãy'];
  const issue=issues[Math.floor(Math.random()*issues.length)];
  const reward=Math.round(it.cost*0.3+20+Math.random()*30);
  return {id:Date.now()+Math.random(),itemId:it.id,issue,reward,day_created:game.day};
}

function renderRepair(){
  const el=document.getElementById('tab-repair');
  if(!game.repairs.length){el.innerHTML='<div class="card empty-state">Chưa có đơn sửa chữa nào.</div>';return;}
  let html='<div class="card"><h3>Sửa chữa</h3><div class="sub">Sửa thiết bị hỏng để nhận tiền thưởng.</div><div class="item-list">';
  game.repairs.forEach((r,idx)=>{
    const it=getItemById(r.itemId); if(!it) return;
    html+=`<div class="item"><div class="info">
      <div class="name">${it.n}</div>
      <div class="meta">Lỗi: ${r.issue} · Phần thưởng: ${fmtMoney(r.reward)}</div>
    </div><div class="row">
      <button class="btn btn-sm btn-p" onclick="fixRepair(${r.id})">Sửa (+${fmtMoney(r.reward)})</button>
      <button class="btn btn-sm btn-err" onclick="skipRepair(${r.id})">Bỏ qua</button>
    </div></div>`;
  });
  html+='</div></div>';
  el.innerHTML=html;
}

function fixRepair(rid){
  const ri=game.repairs.findIndex(r=>r.id===rid);if(ri<0)return;
  const r=game.repairs[ri];
  game.money+=r.reward;
  const it=getItemById(r.itemId);
  pushLog(`Sửa thành công ${it?it.n:''}: +${fmtMoney(r.reward)}`,'ok');
  showToast(`Sửa xong! +${fmtMoney(r.reward)}`,'ok');
  game.repairs.splice(ri,1);
  renderRepair(); renderStats();
}
function skipRepair(rid){
  const ri=game.repairs.findIndex(r=>r.id===rid);if(ri<0)return;
  game.repairs.splice(ri,1);
  renderRepair();
}

function renderSales(){
  const el=document.getElementById('tab-sales');
  if(!game.stock.length){el.innerHTML='<div class="card empty-state">Kho linh kiện trống. Hãy mua hàng từ Shop và chờ vận chuyển!</div>';return;}
  let html=`<div class="card"><h3>Định giá & Bán lẻ</h3>
    <div class="sub">Đặt giá bán cho từng món. Giá càng rẻ, xác suất bán càng cao. Tối đa 200% giá vốn.</div>
    <table><thead><tr><th>Sản phẩm</th><th>Giá vốn</th><th>Giá bán</th><th>Xác suất</th><th></th></tr></thead><tbody>`;
  game.stock.forEach((s,i)=>{
    const it=getItemById(s.id); if(!it) return;
    if(s.sellPrice===undefined) s.sellPrice=Math.round(s.cost*1.2);
    const ratio=s.sellPrice/s.cost;
    const chance=Math.max(10,Math.min(90,Math.round(110-ratio*50)));
    html+=`<tr><td>${it.n}<br><small style="color:var(--txt3)">${CAT_LABELS[it.cat]}</small></td>
      <td>${fmtMoney(s.cost)}</td>
      <td><input type="number" value="${s.sellPrice}" onchange="setSellPrice(${s.uid},this.value)" style="width:80px"></td>
      <td><span class="badge ${chance>=50?'badge-ok':'badge-warn'}">${chance}%</span></td>
      <td><button class="btn btn-sm btn-ok" onclick="sellNow(${s.uid})">Bán ngay</button></td></tr>`;
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
}

function setSellPrice(uid,val){
  const s=game.stock.find(x=>x.uid===uid);if(!s)return;
  s.sellPrice=Math.max(1,parseInt(val)||1);
  renderSales();
}

function sellNow(uid){
  const si=game.stock.findIndex(x=>x.uid===uid);if(si<0)return;
  const s=game.stock[si];
  const ratio=s.sellPrice/s.cost;
  const chance=Math.max(10,Math.min(90,Math.round(110-ratio*50)));
  if(Math.random()*100<chance){
    game.money+=s.sellPrice;
    const it=getItemById(s.id);
    pushLog('Bán '+(it?it.n:'')+': +'+fmtMoney(s.sellPrice),'ok');
    showToast('Đã bán '+(it?it.n:'')+'!','ok');
    game.stock.splice(si,1);
  } else {
    showToast('Không có khách mua!','warn');
    pushLog('Bán lẻ thất bại','warn');
  }
  renderSales(); renderStats();
}

    const id=build[cat]; const it=id?getItemById(id):null;
    html+=`<div class="slot ${it?'filled':''}" onclick="openSlotPicker('${cat}')">
      <div class="slot-label">${CAT_LABELS[cat]}</div>`;

      html+=`<div class="slot-name">${it.n}</div>

    getCoolingForEra(era).forEach(c=>{

    html+='<div class="oc-row"><label>CPU Volt:</label><input type="range" class="oc-slider" min="1.0" max="1.4" step="0.05" value="'+game.overclock.cpuV+'" oninput="setOC(\'cpuV\',this.value);renderBuild()"><span class="oc-value">'+game.overclock.cpuV.toFixed(2)+'V</span></div>';
    html+='<div class="oc-row"><label>GPU xung:</label><input type="range" class="oc-slider" min="1.0" max="1.5" step="0.05" value="'+game.overclock.gpuMul+'" oninput="setOC(\'gpuMul\',this.value);renderBuild()"><span class="oc-value">'+game.overclock.gpuMul.toFixed(2)+'x</span></div>';
    html+='<div class="oc-row"><label>GPU Volt:</label><input type="range" class="oc-slider" min="1.0" max="1.4" step="0.05" value="'+game.overclock.gpuV+'" oninput="setOC(\'gpuV\',this.value);renderBuild()"><span class="oc-value">'+game.overclock.gpuV.toFixed(2)+'V</span></div>';
    html+='<div class="oc-row"><label>RAM xung:</label><input type="range" class="oc-slider" min="1.0" max="1.3" step="0.05" value="'+game.overclock.ramMul+'" oninput="setOC(\'ramMul\',this.value);renderBuild()"><span class="oc-value">'+game.overclock.ramMul.toFixed(2)+'x</span></div>';

    html+='<span class="badge badge-tier">Hao mòn: CPU '+Math.round(wear.cpu)+'% · GPU '+Math.round(wear.gpu)+'% · RAM '+Math.round(wear.ram)+'%</span></div>';

function setBuildCooling(id){
  const c=getCoolingById(id);if(!c)return;
  if(c.cost>0&&game.money<c.cost){showToast('Không đủ tiền mua tản nhiệt','err');return;}
  game.money-=c.cost;game.buildCooling=id;
  pushLog('Lắp tản nhiệt: '+c.n,'info');renderBuild();renderStats();
}

function openSlotPicker(cat){
  const stockItems=game.stock.filter(s=>{
    const it=getItemById(s.id);
    return it&&it.cat===cat;
  });
  if(!stockItems.length){
    let html='<div class="empty-state">Kho không còn '+CAT_LABELS[cat]+'. Hãy mua hàng từ Shop và chờ vận chuyển!</div>';
    html+='<div style="margin-top:12px;text-align:center"><button class="btn btn-p btn-sm" onclick="closeModal();switchTab(\'market\')">Đi mua hàng</button></div>';
    showModal('Chọn '+CAT_LABELS[cat],html);
    return;
  }
  const grouped={};
  stockItems.forEach(s=>{
    if(!grouped[s.id])grouped[s.id]={id:s.id,count:0,items:[]};
    grouped[s.id].count++;
    grouped[s.id].items.push(s);
  });
  const items=Object.values(grouped).sort((a,b)=>{
    const ia=getItemById(a.id),ib=getItemById(b.id);
    return (ia?ia.perf:0)-(ib?ib.perf:0);
  });
  let html='<div class="sub">Lấy từ Kho linh kiện. Còn '+stockItems.length+' món '+CAT_LABELS[cat]+' trong kho.</div>';
  html+='<div class="item-list" style="max-height:300px">';
  items.forEach(g=>{
    const p=getItemById(g.id);if(!p)return;
    const conds=g.items.map(s=>s.used?(s.condition==='good'?'<span class="cond-badge cond-good">Tốt</span>':s.condition==='fair'?'<span class="cond-badge cond-fair">Tã</span>':'<span class="cond-badge cond-bad">Hỏng</span>'):'<span class="cond-badge cond-good">Mới</span>');
    html+='<div class="item"><div class="info"><div class="name">'+p.n+' ×'+g.count+'</div>';
    html+='<div class="meta">Perf '+p.perf+' · T'+p.tier+(p.watt?' · '+p.watt+'W':'')+' · '+conds.join(' ')+'</div></div>';
    html+='<button class="btn btn-sm btn-p" onclick="pickSlot(\''+cat+'\',\''+g.id+'\')">Lắp</button></div>';
  });
  html+='</div>';
  showModal('Chọn '+CAT_LABELS[cat]+' từ kho',html);
}
function pickSlot(cat,id){
  const si=game.stock.findIndex(s=>s.id===id);
  if(si<0){showToast('Linh kiện không có trong kho!','err');return;}
  const stockItem=game.stock[si];
  game.build[cat]=id;
  game.build[cat+'_stockUid']=stockItem.uid;
  game.build[cat+'_used']=stockItem.used;
  game.build[cat+'_condition']=stockItem.condition;
  game.build[cat+'_perfPenalty']=stockItem.perfPenalty;
  game.stock.splice(si,1);
  pushLog('Lấy '+getItemById(id).n+' từ kho để lắp vào khe '+CAT_LABELS[cat],'info');
  closeModal();renderBuild();renderPartsInventory();
}
function clearSlot(cat){
  const uid=game.build[cat+'_stockUid'];
  if(uid){
    const id=game.build[cat];
    const it=getItemById(id);
    if(it){
      game.stock.push({uid:uid,id:id,cost:it.cost,used:game.build[cat+'_used']||false,condition:game.build[cat+'_condition']||'good',conditionLabel:game.build[cat+'_condition']==='fair'?'Hơi tã':game.build[cat+'_condition']==='bad'?'Lỗi/Hỏng nặng':'Hoạt động tốt',perfPenalty:game.build[cat+'_perfPenalty']||0});
      pushLog('Trả '+it.n+' lại kho','info');
    }
  }
  game.build[cat]=null;
  delete game.build[cat+'_stockUid'];
  delete game.build[cat+'_used'];
  delete game.build[cat+'_condition'];
  delete game.build[cat+'_perfPenalty'];
  renderBuild();renderPartsInventory();
}
function resetBuild(){
  CAT_SLOTS.forEach(c=>{
    const uid=game.build[c+'_stockUid'];
    if(uid){
      const id=game.build[c];
      const it=getItemById(id);
      if(it){
        game.stock.push({uid:uid,id:id,cost:it.cost,used:game.build[c+'_used']||false,condition:game.build[c+'_condition']||'good',conditionLabel:game.build[c+'_condition']==='fair'?'Hơi tã':game.build[c+'_condition']==='bad'?'Lỗi/Hỏng nặng':'Hoạt động tốt',perfPenalty:game.build[c+'_perfPenalty']||0});
      }
    }
    game.build[c]=null;
    delete game.build[c+'_stockUid'];
    delete game.build[c+'_used'];
    delete game.build[c+'_condition'];
    delete game.build[c+'_perfPenalty'];
  });
  game.overclock={...OC_DEFAULTS};game.buildCooling='stock';
  renderBuild();renderPartsInventory();
}
function saveBuild(){
  if(!isBuildComplete(game.build)){showToast('Chưa ráp đủ linh kiện','err');return;}
  if(!isBuildValid(game.build)){showToast('PSU không đủ công suất','err');return;}
  const pc={id:Date.now()+Math.random(),perf:calcPCPerf(game.build),ocPerf:getOverclockedPerf(game.build),cooling:game.buildCooling,cost:0};
  let defectiveParts=[],fairCount=0;
  CAT_SLOTS.forEach(cat=>{
    const id=game.build[cat];if(!id)return;
    pc[cat]=id;
    const used=game.build[cat+'_used'],condition=game.build[cat+'_condition'];
    const stockUid=game.build[cat+'_stockUid'];
    if(used&&condition==='bad'){defectiveParts.push(cat);pc[cat+'_defective']=true;}
    else if(used&&condition==='fair'){fairCount++;pc[cat+'_degraded']=true;}
    const it=getItemById(id);
    if(it){
      const disc=getPartnerDiscount(it.cat);
      pc.cost+=disc>0?Math.round(it.cost*(1-disc)):it.cost;
    }
  });
  pc.cost=Math.round(pc.cost);
  if(defectiveParts.length){
    pc.hasDefect=true;pc.defectiveCats=defectiveParts;
    pc.perf=Math.round(pc.perf*0.5);
    pc.ocPerf=Math.round(pc.ocPerf*0.5);
    pushLog('Ráp PC #'+Math.round(pc.id)+': '+pc.perf+' perf [CÓ '+defectiveParts.length+' LINH KIỆN HỎNG!]','err');
    showToast('PC có linh kiện hỏng! Sẽ gây lỗi khi sử dụng','err');
  }else if(fairCount>0){
    const penalty=1-fairCount*0.1;
    pc.perf=Math.round(pc.perf*penalty);
    pc.ocPerf=Math.round(pc.ocPerf*penalty);
    pushLog('Ráp PC #'+Math.round(pc.id)+': '+pc.perf+' perf [giảm do '+fairCount+' linh kiện tã]','warn');
    showToast('PC hiệu năng giảm do linh kiện đồ cũ tã','warn');
  }else{
    pushLog('Ráp PC #'+Math.round(pc.id)+': '+pc.perf+' perf, '+fmtMoney(pc.cost),'ok');
    showToast('Đã ráp PC '+pc.perf+' perf!','ok');
  }
  pc.cost=Math.round(pc.cost);
  game.pcs.push(pc);
  CAT_SLOTS.forEach(c=>{game.build[c]=null;delete game.build[c+'_stockUid'];delete game.build[c+'_used'];delete game.build[c+'_condition'];delete game.build[c+'_perfPenalty'];});renderBuild();renderPartsInventory();renderStats();
  saveGame(true);
}



// ============ PC WAREHOUSE ============
function renderWarehouse(){
  const el=document.getElementById('tab-warehouse');
  const allPCs=game.pcs;
  const inCafe=game.stations.filter(s=>s.pc).map(s=>s.pc);
  const free=allPCs.filter(p=>!inCafe.includes(p.id)&&!p.assignedContract);
  const used=allPCs.filter(p=>inCafe.includes(p.id));
  let filterFunc;
  if(S.warehouseFilter==='free')filterFunc=p=>!inCafe.includes(p.id)&&!p.assignedContract;
  else if(S.warehouseFilter==='cafe')filterFunc=p=>inCafe.includes(p.id);
  else if(S.warehouseFilter==='defective')filterFunc=p=>p.hasDefect;
  else filterFunc=()=>true;
  const filtered=allPCs.filter(filterFunc);
  let html='<div class="card"><h3>Kho PC hoàn chỉnh ('+allPCs.length+' máy)</h3>';
  html+='<div class="sub">Toàn bộ PC đã ráp. Từ đây có thể: gửi chạy Benchmark, gắn vào tiệm NET, hoặc giao cho khách hàng.</div>';
  html+='<div class="news-stats"><div class="news-stat"><span class="v" style="color:var(--ok)">'+free.length+'</span><span class="l">Sẵn sàng</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--ac)">'+used.length+'</span><span class="l">Đang ở tiệm NET</span></div>';
  html+='<div class="news-stat"><span class="v" style="color:var(--err)">'+allPCs.filter(p=>p.hasDefect).length+'</span><span class="l">Có linh kiện hỏng</span></div></div>';
  html+='<div class="wh-filter"><button class="'+(S.warehouseFilter==='all'?'active':'')+'" onclick="setWarehouseFilter(\'all\')">Tất cả ('+allPCs.length+')</button>';
  html+='<button class="'+(S.warehouseFilter==='free'?'active':'')+'" onclick="setWarehouseFilter(\'free\')">Sẵn sàng ('+free.length+')</button>';
  html+='<button class="'+(S.warehouseFilter==='cafe'?'active':'')+'" onclick="setWarehouseFilter(\'cafe\')">Đang dùng ('+used.length+')</button>';
  html+='<button class="'+(S.warehouseFilter==='defective'?'active':'')+'" onclick="setWarehouseFilter(\'defective\')">Lỗi ('+allPCs.filter(p=>p.hasDefect).length+')</button></div>';
  if(!allPCs.length){
    html+='<div class="wh-empty">Kho PC trống. Hãy sang tab Ráp PC để lắp máy!</div>';
  }else{
    html+='<div class="wh-grid">';
    filtered.forEach(pc=>{
      const inUse=inCafe.includes(pc.id);
      const isDef=pc.hasDefect;
      html+='<div class="wh-card '+(inUse?'assigned':'')+'">';
      html+='<div class="wh-head"><div><div class="wh-id">PC #'+Math.round(pc.id)+'</div>';
      if(isDef)html+='<span class="cond-badge cond-bad">Linh kiện hỏng!</span>';
      html+='</div><div class="wh-perf">'+pc.perf+'</div></div>';
      html+='<div class="wh-specs">';
      ['cpu','gpu','ram'].forEach(cat=>{
        if(pc[cat]){const it=getItemById(pc[cat]);if(it)html+='<span class="wh-spec">'+CAT_LABELS[cat]+': '+it.n+'</span>';}
      });
      html+='</div>';
      html+='<div class="meta" style="font-size:11px">Giá vốn: '+fmtMoney(pc.cost)+(pc.cooling?' · Tản nhiệt: '+pc.cooling:'')+'</div>';
      if(isDef){
        html+='<div class="cond-warning">⚠️ PC này có linh kiện hỏng! Gắn vào tiệm NET sẽ gây sự cố.</div>';
      }
      html+='<div class="wh-actions">';
      html+='<button class="btn btn-sm btn-ghost" onclick="benchFromWarehouse('+pc.id+')">Benchmark</button>';
      if(!inUse){
        html+='<button class="btn btn-sm btn-p" onclick="assignPCtoCafe('+pc.id+')">Gắn tiệm NET</button>';
      }else{
        html+='<button class="btn btn-sm btn-ghost" onclick="detachStationByPC('+pc.id+')">Gỡ khỏi tiệm</button>';
      }
      html+='<button class="btn btn-sm btn-err" onclick="scrapPC('+pc.id+')">Tháo récup</button>';
      html+='</div></div>';
    });
    html+='</div>';
  }
  html+='</div>';
  el.innerHTML=html;
}

function setWarehouseFilter(f){S.warehouseFilter=f;renderWarehouse();}

function benchFromWarehouse(pcId){
  const pc=game.pcs.find(p=>p.id===pcId);if(!pc)return;
  const defectPenalty=pc.hasDefect?0.5:1;
  const pcBuild={cpu:pc.cpu,gpu:pc.gpu,mb:pc.mb,ram:pc.ram,psu:pc.psu,case:pc.case,storage:pc.storage};
  function renderWhBench(gfxKey){
    const gfx=GFX_SETTINGS[gfxKey]||GFX_SETTINGS.medium;
    const era=game.eraIdx;
    const availableGames=Object.entries(GAME_LIBRARY).filter(([k,g])=>g.e<=era);
    let h='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:10px">';
    availableGames.forEach(([k,g])=>{
      let avgFps=calcFPS(pcBuild,k,gfxKey);
      avgFps=Math.max(1,Math.round(avgFps*defectPenalty));
      const minFps=Math.max(1,Math.round(avgFps*0.7));
      h+='<div class="game-card"><div style="font-weight:700;font-size:13px">'+g.name+'</div><div class="fps-display"><div class="fps-num" style="font-size:30px;color:'+(avgFps>=60?'var(--ok)':avgFps>=30?'var(--ac)':'var(--err)')+'">'+avgFps+'</div><div class="fps-label">'+gfx.resLabel+'</div><div style="font-size:11px;color:var(--txt3)">Min: '+minFps+'</div></div></div>';

function assignPCtoCafe(pcId){

function detachStationByPC(pcId){

function scrapPC(pcId){
  const idx=game.pcs.findIndex(p=>p.id===pcId);
  if(idx<0)return;
  const pc=game.pcs[idx];
  const inUse=game.stations.some(s=>s.pc===pcId);
  if(inUse){showToast('Gỡ PC khỏi tiệm NET trước khi tháo','err');return;}
  const scrapValue=Math.round(pc.cost*0.3);
  game.money+=scrapValue;
  CAT_SLOTS.forEach(cat=>{
    if(pc[cat]){
      const it=getItemById(pc[cat]);
      if(it){game.stock.push({id:pc[cat],cost:Math.round(it.cost*0.3),used:true,condition:pc[cat+'_defective']?'bad':pc[cat+'_degraded']?'fair':'good',conditionLabel:pc[cat+'_defective']?'Lỗi/Hỏng nặng':pc[cat+'_degraded']?'Hơi tã - giảm hiệu năng':'Hoạt động tốt',perfPenalty:pc[cat+'_defective']?0.5:pc[cat+'_degraded']?0.2:0});}
    }
  });
  game.pcs.splice(idx,1);
  pushLog('Tháo recursively PC #'+Math.round(pcId)+': thu hồi '+fmtMoney(scrapValue)+' + linh kiện','warn');
  showToast('Tháo PC: +'+fmtMoney(scrapValue)+' + thu linh kiện','ok');
  renderWarehouse();renderStats();saveGame(true);
}

function levelUpEmployee(empId){const e=game.employees.find(em=>em.id===empId);if(!e)return;const et=EMPLOYEE_TYPES.find(t=>t.id===e.role);if(!et)return;const upCost=et.salary*10*(e.level||1);if(game.money<upCost){showToast('Không đủ tiền nâng cấp','err');return;}game.money-=upCost;e.level=(e.level||1)+1;pushLog('Nâng cấp '+et.n+' lên Lv.'+e.level,'ok');showToast(et.n+' lên Lv.'+e.level+'!','ok');renderStaff();renderStats();}
function buyStock(sid,qty){const s=game.stocks.find(x=>x.id===sid);if(!s)return;const cost=s.price*qty;if(game.money<cost){showToast('Không đủ tiền','err');return;}game.money-=cost;s.playerShares+=qty;pushLog('Mua '+qty+' cp '+s.id+': '+fmtMoney(cost),'info');showToast('Đã mua '+qty+' '+s.id,'ok');renderStaff();renderStats();}
function sellStock(sid,qty){const s=game.stocks.find(x=>x.id===sid);if(!s)return;if(s.playerShares<qty){showToast('Không đủ cổ phiếu','err');return;}s.playerShares-=qty;const rev=s.price*qty;game.money+=rev;pushLog('Bán '+qty+' cp '+s.id+': '+fmtMoney(rev),'ok');showToast('Đã bán '+qty+' '+s.id,'ok');renderStaff();renderStats();}
function updateStocks(){
  const marketCrash=Math.random()<0.02;
  game.stocks.forEach(s=>{const tk=STOCK_TICKERS.find(t=>t.id===s.id);const vol=tk?tk.volatility:0.1;s.prevPrice=s.price;let ch=(Math.random()-0.5)*2*vol;
    if(s.id==='TECH'){if(game.money<0)ch-=0.05;if(game.marketShare>20)ch+=0.02;if(game.reputation>50)ch+=0.01;if(game.techLevel>80)ch+=0.02;if(game.craftedItems.length>5)ch+=0.01;if(game.money>100000)ch+=0.01;if(game.marketShare<5)ch-=0.03;}
    if(marketCrash)ch-=0.15;
    s.price=Math.max(1,s.price*(1+ch));s.history.push(s.price);if(s.history.length>30)s.history.shift();});
  if(marketCrash)pushLog('SỤP CỔ PHIẾU! Thị trường giảm giá mạnh!','err');
}
const AI_PRODUCT_LINES={cpu:['Core','Ryzen','Snapdragon'],gpu:['GeForce','Radeon','Arc'],laptop:['ProBook','UltraBook','GamerBook'],mobile:['Galaxy','iPhone','Redmi']};
function updateAiBrands(){
  processAiBrandLifeCycle();
  const eraBonus=1+game.eraIdx*0.15;
  game.aiBrands.forEach(brand=>{
    if(brand.bankrupt)return;
    brand.rndProgress+=(100/brand.rndInterval)*eraBonus;
    if(brand.rndProgress>=100){brand.rndProgress=0;const techGain=Math.round((5+Math.random()*15)*(1+game.eraIdx*0.1));brand.techLevel+=techGain;
      const cat=brand.cat,perf=brand.techLevel+Math.round(Math.random()*10);
      const lines=AI_PRODUCT_LINES[cat]||['Series'];
      const lineName=lines[Math.floor(Math.random()*lines.length)];
      const gen=Math.floor(brand.techLevel/20)+1;
      const tierNames=['','S','Pro','Pro Max','Ultra','Extreme'];
      const tierName=tierNames[Math.min(5,Math.floor(perf/25))];
      const name=brand.name+' '+lineName+' G'+gen+' '+tierName;
      const itemId='aibrand_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
      const vram=cat==='gpu'?Math.round(4+perf/15):0;
      CATALOG.push({id:itemId,n:name,cat,e:game.eraIdx,cost:Math.round(perf*30),watt:Math.round(perf*2+30),perf,tier:Math.min(5,3+Math.floor(perf/40)),aiMade:true,brand:brand.name,vram});
      pushLog('Hãng AI '+brand.name+' tung ra '+name+' ('+perf+' perf'+(vram?', '+vram+'GB':'')+')}!','err');showToast(brand.name+' phát hành '+name+'!','warn');
      brand.share=Math.min(40,brand.share+0.5);
      if(perf>game.techLevel+20){game.marketShare=Math.max(1,game.marketShare-0.5);pushLog(brand.name+' vượt mặt bạn về công nghệ! Thị phần -0.5%','err');}}
  });
}
function processAutoRepair(){
  if(!hasEmployee('autoRepair')||!game.repairs.length)return;

  const it=getItemById(r.itemId);pushLog('Nhân viên tự sửa '+(it?it.n:'')+': +'+fmtMoney(r.reward),'ok');

function processEmployeeSalaries(){
  let total=0;game.employees.forEach(e=>{const et=EMPLOYEE_TYPES.find(t=>t.id===e.role);if(et)total+=et.salary;});

function setCafePrice(v){game.cafePricePerHour=Math.max(1,Math.min(50,parseInt(v)||5));renderCafe();}
function expandCafe(){
  const cost=2000+game.cafeExpandCount*500;
  if(game.money<cost){showToast('Không đủ tiền mở rộng','err');return;}
  game.money-=cost;
  game.cafeExpandCount+=2;
  const nextId=game.stations.length+1;
  game.stations.push({id:nextId,pc:null});
  game.stations.push({id:nextId+1,pc:null});
  pushLog('Mở rộng phòng NET: +2 máy (tổng '+game.stations.length+')','ok');
  showToast('Mở rộng thành công! Hiện có '+game.stations.length+' máy','ok');
  renderCafe();renderStats();
  saveGame(true);

function setOC(key,val){
  game.overclock[key]=parseFloat(val);
  if(!game.overclock.wear)game.overclock.wear={cpu:0,gpu:0,ram:0};
  const mulKey=key.replace('Mul','').replace('V','');
  renderBuild();
}
function resetOverclock(){
  game.overclock={cpuMul:1,gpuMul:1,ramMul:1,cpuV:1.0,gpuV:1.0,ramV:1.0};
  pushLog('Đặt lại xung mặc định','info');
  renderBuild();
}
function getStabilityScore(build){
  const oc=game.overclock;
  let score=100;
  if(build.cpu){const cpu=getItemById(build.cpu);if(cpu){score-=(oc.cpuMul-1)*30;score-=(oc.cpuV-1)*40;}}
  if(build.gpu){const gpu=getItemById(build.gpu);if(gpu){score-=(oc.gpuMul-1)*25;score-=(oc.gpuV-1)*35;}}
  if(build.ram){score-=(oc.ramMul-1)*15;}
  const temp=getAvgTemp(build);
  if(temp>80)score-=(temp-80)*2;
  if(temp>90)score-=(temp-90)*3;
  return Math.max(0,Math.min(100,Math.round(score)));
}
function getThermalThrottle(build){
  const temp=getAvgTemp(build);
  if(temp<85)return 1;
  if(temp<95)return Math.max(0.7,1-(temp-85)*0.03);
  return Math.max(0.3,1-(temp-95)*0.05);
}
function applyHardwareWear(build){
  if(!game.overclock.wear)game.overclock.wear={cpu:0,gpu:0,ram:0};
  const oc=game.overclock;
  ['cpu','gpu','ram'].forEach(c=>{
    if(!build[c])return;
    const mul=oc[c+'Mul']||1;
    if(mul>1.1){game.overclock.wear[c]=(game.overclock.wear[c]||0)+(mul-1)*0.5;}
  });
}

const COMP_NAMES=['TechNova','ByteForge','QuantumByte','MegaChip','CyberDynex','PrimeCore','NexTech','ApexByte','CoreVision','TitanChip'];
const COMP_EVENTS=['boom','boom','stable','stable','stuck','fall','boom','stable','stuck','fall'];

function initCompetitors(){
  return COMP_NAMES.slice(0,6).map((n,i)=>({
    id:i, name:n, share:10+i*3, revenue:5000+i*2000,
    status:'stable', eraStuck:-1, eventDay:0,
    trend:0,
  }));
}

function updateCompetitors(){
  game.competitors.forEach(c=>{
    const roll=Math.random();
    if(c.status==='stuck'){
      // Stuck at a specific year - decline
      c.share=Math.max(1,c.share-0.5);
      c.revenue=Math.max(500,c.revenue-200);
      if(Math.random()<0.15){
        c.status='stable'; c.eraStuck=-1;
        pushLog(c.name+' đã thoát khỏi bế tắc, phục hồi trở lại.','ok');
      }
    } else if(roll<0.15){
      // Boom event
      c.status='rising'; c.trend=Math.random()*3+1;
      c.share+=c.trend; c.revenue+=Math.round(c.trend*1500);
      pushLog(c.name+' bứt phá tăng trưởng, thị phần lên '+Math.round(c.share)+'%!','warn');
    } else if(roll<0.25){
      // Stuck event - get stuck at current era
      c.status='stuck'; c.eraStuck=game.eraIdx;
      pushLog(c.name+' gặp khủng hoảng, kẹt tiến trình ở '+ERAS[game.eraIdx].name+'!','err');
    } else if(roll<0.35){
      // Fall event
      c.status='falling'; c.trend=Math.random()*2+0.5;
      c.share=Math.max(1,c.share-c.trend);
      c.revenue=Math.max(500,c.revenue-Math.round(c.trend*1000));
      pushLog(c.name+' lao dốc thị phần, tụt xuống '+Math.round(c.share)+'%.','info');
    } else {
      // Stable - slow growth
      c.status='stable'; c.share+=0.2; c.revenue+=Math.round(Math.random()*500);
    }
    c.share=Math.max(1,Math.min(45,c.share));
  });
  // Recalculate player market share
  const totalShare=game.competitors.reduce((s,c)=>s+c.share,0)+game.marketShare;
  if(totalShare>100){
    const scale=100/totalShare;
    game.competitors.forEach(c=>c.share*=scale);
    game.marketShare*=scale;
  }
  game.marketShare=Math.max(1,Math.min(60,game.marketShare));
}

  {id:'seasonic',name:'Seasonic',cat:'psu',reqRep:20,baseDisc:0.07,maxDisc:0.18},
];

function initPartners(){
  return SUPPLIERS.map(s=>({...s,active:false,discount:0,cooldown:0,autoOffered:false}));
}

function getPartnerDiscount(cat){
  let disc=0;
  game.partners.forEach(p=>{
    if(p.active && p.cat===cat) disc=Math.max(disc,p.discount);
  });
  return disc;
}

function applyPartnerDiscount(item){
  const disc=getPartnerDiscount(item.cat);
  if(disc>0) return Math.round(item.cost*(1-disc));
  return item.cost;
}

function applyPartnership(cat,supplierId){
  const p=game.partners.find(x=>x.id===supplierId);
  if(!p) return;
  const fee=500+Math.round(p.reqRep*20);
  if(game.money<fee){showToast('Không đủ tiền ngoại giao ('+fmtMoney(fee)+')','err');return;}
  if(p.cooldown>0){showToast('Cần đợi '+p.cooldown+' ngày nữa để thử lại','warn');return;}
  game.money-=fee;
  // Success chance based on reputation, market share, and crafted item quality
  let chance=Math.min(0.85,(game.reputation/p.reqRep)*0.5+game.marketShare/100*0.2);
  const craftedBonus=game.craftedItems.reduce((s,item)=>s+(item.perf||0)*0.002,0);
  chance=Math.min(0.95,chance+craftedBonus);
  if(Math.random()<chance){
    const disc=p.baseDisc+Math.random()*(p.maxDisc-p.baseDisc);
    p.active=true; p.discount=disc; p.cooldown=0;
    pushLog('Ký hợp đồng thành công với '+p.name+'! Chiết khấu '+Math.round(disc*100)+'% cho '+CAT_LABELS[p.cat],'ok');
    showToast('Hợp tác thành công với '+p.name+'!','ok');
    game.reputation+=5;
  } else {
    p.cooldown=5;
    pushLog('Hợp đồng với '+p.name+' bị từ chối. Đợi 5 ngày để thử lại.','warn');
    showToast('Hợp tác thất bại với '+p.name,'err');
  }
  renderPartners(); renderStats();
}

function checkAutoPartnership(){
  game.partners.forEach(p=>{
    if(!p.active && !p.autoOffered && game.reputation>=p.reqRep*1.5){
      // Auto-offer from supplier based on crafted item quality
      const topCrafted=game.craftedItems.filter(c=>c.cat===p.cat);
      if(topCrafted.length>0){
        const bestPerf=Math.max(...topCrafted.map(c=>c.perf||0));
        if(bestPerf>80){
          p.autoOffered=true;
          const disc=p.baseDisc+Math.random()*(p.maxDisc-p.baseDisc);
          p.active=true; p.discount=disc;
          pushLog(p.name+' tự ngỏ lời hợp tác! Chiết khấu '+Math.round(disc*100)+'% cho '+CAT_LABELS[p.cat],'ok');
          showToast(p.name+' chủ động mời hợp tác!','ok');
          game.reputation+=3;
        }
      }
    }
  });
}

function startRndProject(cat,baseItemId,customName,customPerf,customWatt,customCost,customVram){

    progress:0, totalDays:Math.max(3,Math.ceil(customPerf/20)),

  showToast('Dự án R&D đã bắt đầu!','ok');

}

function updateRndProjects(){
  for(let i=game.rndProjects.length-1;i>=0;i--){
    const p=game.rndProjects[i];
    p.progress+=100/p.totalDays;
    if(p.progress>=100){
      const itemId='craft_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
      const crafted={
        id:itemId, n:p.customName, cat:p.cat, e:game.eraIdx,
        cost:p.customCost, watt:p.customWatt, perf:p.customPerf, tier:4,
        crafted:true, vram:p.customVram,
      };
      CATALOG.push(crafted);
      game.craftedItems.push(crafted);
      game.stock.push({id:itemId,cost:p.customCost,used:false});
      pushLog('R&D hoàn thành: '+p.customName+' ('+p.customPerf+' perf)!','ok');
      showToast('Chế tạo thành công '+p.customName+'!','ok');
      game.reputation+=Math.round(p.customPerf/10);
      game.techLevel=Math.max(game.techLevel,p.customPerf);
      game.rndProjects.splice(i,1);
      checkAutoPartnership();
      checkEndgameTrigger();
    }
  }
}

// ============ ENDGAME SYSTEM ============
const AI_NAME_PREFIXES=['Nexus','Titan','Quantum','Apex','Blackwell','Hyper','Ultra','Prime','Omega','Stellar'];
const AI_NAME_SUFFIXES=['Ultra','Titan','Apex','Quantum','Supreme','Max','Extreme','Pro Max','Phantom','Genesis'];

function checkEndgameTrigger(){
  if(!game.endgameActive && game.eraIdx>=6 && game.techLevel>=100){
    game.endgameActive=true;
    pushLog('GIAI ĐOẠN ENDGAME BẮT ĐẦU! Cuộc đua công nghệ vô cực!','ok');
    showToast('ENDGAME: Kỷ nguyên công nghệ mới mở ra!','ok');
  }
}

function generateAiThreat(){
  if(!game.endgameActive) return;
  // Find player's best crafted item to counter
  const bestCrafted=game.craftedItems.sort((a,b)=>(b.perf||0)-(a.perf||0))[0];
  if(!bestCrafted) return;
  const targetPerf=Math.round((bestCrafted.perf||100)*1.3+Math.random()*20);
  const cat=bestCrafted.cat;
  const prefix=AI_NAME_PREFIXES[Math.floor(Math.random()*AI_NAME_PREFIXES.length)];
  const suffix=AI_NAME_SUFFIXES[Math.floor(Math.random()*AI_NAME_SUFFIXES.length)];
  const brand=cat==='cpu'?'RivalCore':cat==='gpu'?'RivalVision':'RivalTech';
  const name=brand+' '+prefix+' '+suffix;
  const vram=cat==='gpu'?Math.round((bestCrafted.vram||8)*1.5+Math.random()*8):0;
  const threat={
    id:Date.now()+Math.random(),
    name, cat, perf:targetPerf, watt:Math.round(targetPerf*2+50),
    vram, cost:Math.round(targetPerf*30),
    maker:game.competitors[Math.floor(Math.random()*game.competitors.length)].name,
  };
  CATALOG.push({
    id:'ai_threat_'+threat.id, n:name, cat, e:7,
    cost:threat.cost, watt:threat.watt, perf:targetPerf, tier:5,
    aiMade:true, vram,
  });
  game.aiThreats.push(threat);
  pushLog('AI đối thủ '+threat.maker+' tung ra '+name+' ('+targetPerf+' perf'+(vram?', '+vram+'GB VRAM':'')+ ')!','err');
  showToast('CẢNH BÁO: Đối thủ tung ra '+name+'!','err');
}

function updateEndgame(){
  if(!game.endgameActive) return;
  // AI generates threats periodically
  if(Math.random()<0.3) generateAiThreat();
  // Player market share pressure from AI
  game.marketShare=Math.max(2,game.marketShare-0.3);
}

function performWebSearch(query){
  game.webSearchQuery=query;
  game.webWikiPage=null;
  const q=query.toLowerCase().trim();
  let results=[];
  CATALOG.forEach(item=>{
    const catLabel=CAT_LABELS[item.cat]||item.cat||'Khác';
    if(!q || item.n.toLowerCase().includes(q) || catLabel.toLowerCase().includes(q)){
      results.push({id:item.id,title:item.n,desc:catLabel+' · Era '+item.e+' · Perf '+item.perf+(item.watt?' · '+item.watt+'W':'')+(item.vram?' · '+item.vram+'GB VRAM':'')});
    }
  });
  game.competitors.forEach(c=>{
    if(!q || c.name.toLowerCase().includes(q) || q.includes('doi thu') || q.includes('competitor')){
      results.push({id:'comp_'+c.id,title:c.name+' - Công ty đối thủ',desc:'Thị phần: '+Math.round(c.share)+'% · Doanh thu: '+fmtMoney(c.revenue)+' · Trạng thái: '+c.status});
    }
  });
  game.aiBrands.filter(b=>!b.bankrupt).forEach(b=>{
    if(!q || b.name.toLowerCase().includes(q) || q.includes('ai') || q.includes('hang')){
      results.push({id:'aibrand_'+b.id,title:b.name+' - Hãng AI',desc:'Thị phần: '+Math.round(b.share)+'% · Doanh thu: '+fmtMoney(b.revenue)+' · Công nghệ: '+b.techLevel+' · Trạng thái: '+(b.status==='rising'?'Đang tăng':b.status==='falling'?'Đang giảm':b.status==='stuck'?'Bị kẹt':'Ổn định')});
    }
  });
  game.webSearchResults=results.slice(0,30);
  renderWeb();
}

function openWikiPage(id){
  if(id.startsWith('comp_')){
    const compId=parseInt(id.replace('comp_',''));
    const c=game.competitors.find(x=>x.id===compId);
    if(c) game.webWikiPage={type:'competitor',data:c};
  } else if(id.startsWith('aibrand_')){
    const brandId=parseInt(id.replace('aibrand_',''));
    const b=game.aiBrands.find(x=>x.id===brandId);
    if(b) game.webWikiPage={type:'aibrand',data:b};
  } else {
    const item=getItemById(id);
    if(item) game.webWikiPage={type:'item',data:item};
  }
  renderWeb();
}

function showCompetitorDirectory(){
  let html='<div class="wiki-page"><h4>Danh bạ Công ty Công nghệ - Bảng xếp hạng thị phần</h4>';
  html+='<div class="sub">Xếp hạng tất cả công ty trên thị trường. Bấm vào tên hãng AI để xem chi tiết.</div>';
  const all=[{name:'Tech Empire (Bạn)',share:game.marketShare,revenue:game.totalRevenue,status:'player',type:'player'}];
  game.competitors.forEach(c=>all.push({name:c.name,share:c.share,revenue:c.revenue,status:c.status,type:'competitor',id:c.id}));
  game.aiBrands.filter(b=>!b.bankrupt).forEach(b=>all.push({name:b.name,share:b.share,revenue:b.revenue,status:b.status,type:'ai',id:b.id}));
  all.sort((a,b)=>b.share-a.share);
  all.forEach((c,i)=>{
    const statusClass=c.status==='player'?'stable':c.status;
    const statusText=c.status==='player'?'Người chơi':c.status==='rising'?'Đang tăng':c.status==='falling'?'Đang giảm':c.status==='stuck'?'Bị kẹt':c.status==='leader'?'Đứng đầu':'Ổn định';
    html+='<div class="comp-card"><div class="comp-header"><span class="comp-name">#'+(i+1)+' ';
    if(c.type==='ai')html+='<a class="brand-link" onclick="showAiBrandProfile('+c.id+')">'+c.name+'</a>';
    else if(c.type==='competitor')html+='<a class="brand-link" onclick="openWikiPage(\'comp_'+c.id+'\')">'+c.name+'</a>';
    else html+=c.name;
    html+='</span>';
    html+='<span class="comp-status '+statusClass+'">'+statusText+'</span></div>';
    html+='<div class="comp-bar"><div class="fill" style="width:'+Math.min(100,c.share*2)+'%;background:'+(c.status==='player'?'var(--p)':c.status==='rising'?'var(--ok)':c.status==='falling'||c.status==='stuck'?'var(--err)':'var(--s)')+'"></div></div>';
